<style>/* Megalodon · estilos. Sistema Rosetta/WhiteFox de Yoandy Ramírez Delgado: oscuro por defecto, claro con data-theme='light'.
   Neutros + un acento azul + verde de recompensa + rojo de error. Sombras suaves, sin bordes ni barras laterales. Contraste de texto ≥ 7:1. */
:root {
  --font-sans: ui-sans-serif, system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  --r-chip: 6px; --r-ctl: 10px; --r-card: 16px; --r-dlg: 20px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --top-h: 60px;

  color-scheme: dark;
  --ground: #0b0d11; --surface: #12151b; --surface-2: #1a1e26; --surface-3: #232831;
  --ink: #eef2f6; --ink-2: #c9d0d8; --ink-3: #b2bbc6; --ink-4: #5d6672;
  --accent: #6cb2ff; --accent-ink: #04152b; --accent-soft: rgb(108 178 255 / 0.15);
  --ok: #57dc98; --ok-ink: #032614; --ok-soft: rgb(87 220 152 / 0.13);
  --bad: #ff8f86; --bad-ink: #2b0503; --bad-soft: rgb(255 143 134 / 0.14);
  --glass: rgb(18 21 27 / 0.78); --glass-thick: rgb(18 21 27 / 0.96);
  --sh-panel: 0 1px 2px rgb(0 0 0 / 0.45), 0 12px 32px rgb(0 0 0 / 0.28);
  --sh-overlay: 0 2px 8px rgb(0 0 0 / 0.5), 0 30px 80px rgb(0 0 0 / 0.55);
  --sh-top: 0 1px 0 rgb(255 255 255 / 0.04), 0 10px 30px -18px rgb(0 0 0 / 0.8);
  --sh-raise: 0 1px 2px rgb(0 0 0 / 0.5), 0 2px 8px rgb(0 0 0 / 0.25);
  --cli: #ffb4ad; --cli-bg: rgb(255 143 134 / 0.1); --srv: #a9d1ff; --srv-bg: rgb(108 178 255 / 0.1);
  /* reglas de color de paquetes (texto ≥ 7:1 sobre cada fondo) */
  --pk-tcp: #241f3d; --pk-http: #17321f; --pk-udp: #13293d; --pk-arp: #352a17; --pk-synfin: #2d3138; --pk-smb: #33321a; --pk-icmp: #3a1f3a;
  --pk-rst: #5e1015; --pk-rst-ink: #ffe0b8; --pk-bad: #000000; --pk-bad-ink: #ff8f86;
}
[data-theme='light'] {
  color-scheme: light;
  --ground: #f3f5f8; --surface: #ffffff; --surface-2: #eef1f5; --surface-3: #e1e6ed;
  --ink: #0b1016; --ink-2: #252e39; --ink-3: #3a434e; --ink-4: #a3acb7;
  --accent: #143f94; --accent-ink: #ffffff; --accent-soft: rgb(20 63 148 / 0.1);
  --ok: #07583a; --ok-ink: #ffffff; --ok-soft: rgb(7 88 58 / 0.1);
  --bad: #a8221b; --bad-ink: #ffffff; --bad-soft: rgb(168 34 27 / 0.09);
  --glass: rgb(255 255 255 / 0.82); --glass-thick: rgb(255 255 255 / 0.97);
  --sh-panel: 0 1px 3px rgb(15 23 42 / 0.05), 0 10px 25px -5px rgb(15 23 42 / 0.07);
  --sh-overlay: 0 4px 14px rgb(15 23 42 / 0.08), 0 25px 50px -10px rgb(15 23 42 / 0.18);
  --sh-top: 0 1px 0 rgb(15 23 42 / 0.04), 0 10px 30px -18px rgb(15 23 42 / 0.25);
  --sh-raise: 0 1px 2px rgb(15 23 42 / 0.08), 0 2px 6px rgb(15 23 42 / 0.06);
  --cli: #8c1a14; --cli-bg: #fcecea; --srv: #123d86; --srv-bg: #e9f0fc;
  --pk-tcp: #e7e6ff; --pk-http: #e4ffc7; --pk-udp: #daeeff; --pk-arp: #faf0d7; --pk-synfin: #d9d9d9; --pk-smb: #feffd0; --pk-icmp: #fce0ff;
  --pk-rst: #a40000; --pk-rst-ink: #fffc9c; --pk-bad: #12272e; --pk-bad-ink: #ff9d9d;
}
html.theming, html.theming *, html.theming *::before, html.theming *::after { transition: background-color 0.3s var(--ease-out), color 0.3s var(--ease-out), fill 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out) !important; }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top-h) + 16px); background: var(--ground); }
body { margin: 0; min-height: 100dvh; background: var(--ground); color: var(--ink); font: 15px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -0.015em; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
code, kbd, .mono { font-family: var(--font-mono); font-size: 0.9em; }
code { overflow-wrap: anywhere; }
.num, .n { font-variant-numeric: tabular-nums; }
kbd { display: inline-flex; align-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--r-chip); background: var(--surface-3); color: var(--ink-2); font-size: 11.5px; font-weight: 600; box-shadow: inset 0 -1px 0 rgb(0 0 0 / 0.18); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 10px 14px; border-radius: var(--r-ctl); background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; transition: top 0.2s var(--ease-out); }
.skip:focus { top: 12px; }
.noscript { padding: 40px; text-align: center; }
.i { width: 18px; height: 18px; flex: none; }
.i.sm { width: 15px; height: 15px; }
.muted { color: var(--ink-3); }
.sm { font-size: 13px; }
.okt { color: var(--ok); font-weight: 600; }
.badt { color: var(--bad); font-weight: 600; }
.center { text-align: center; }
.grow { flex: 1; }
.hide { display: none !important; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack-sm { display: grid; gap: 8px; }
.wrap { width: min(1160px, 100% - 40px); margin-inline: auto; }
.wrap-wide { width: min(1600px, 100% - 32px); margin-inline: auto; }
.page { padding-block: 36px 24px; }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--sh-panel); padding: 20px; }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.lead { font-size: 18px; color: var(--ink-2); max-width: 56ch; }
.note { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--accent-soft); color: var(--ink-2); }

#main { outline: none; }
#main.enter > * { animation: enter 0.24s var(--ease-out) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border: 0; border-radius: var(--r-ctl); background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; transition: transform 0.16s var(--ease-out), background-color 0.16s var(--ease-out), box-shadow 0.16s var(--ease-out); -webkit-tap-highlight-color: transparent; }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: var(--sh-raise); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.danger { background: var(--bad); color: var(--bad-ink); }
.btn.lg { height: 48px; padding: 0 22px; font-size: 15.5px; border-radius: 12px; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; gap: 6px; }
.btn:disabled { opacity: 0.5; }
.ibtn { display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-2); text-decoration: none; transition: transform 0.16s var(--ease-out), background-color 0.16s var(--ease-out), color 0.16s; }
.ibtn.sm { width: 30px; height: 30px; border-radius: 8px; }
.ibtn:active:not(:disabled) { transform: scale(0.94); }
.ibtn:disabled { opacity: 0.4; }
.ibtn.done { color: var(--ok); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled) { background: var(--surface-3); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--bad) 88%, var(--ink)); }
  .ibtn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
}
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.meter { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 0.5s var(--ease-out), background-color 0.3s; }
.meter.full i { background: var(--ok); }

/* ---------- Barra superior ---------- */
.top { position: sticky; top: 0; z-index: 30; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px); box-shadow: var(--sh-top); }
.top-in { display: flex; align-items: center; gap: 16px; height: var(--top-h); padding: 0 max(16px, env(safe-area-inset-left)); width: min(1600px, 100%); margin-inline: auto; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; letter-spacing: -0.02em; font-size: 17px; }
.logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
.logo .i { width: 19px; height: 19px; }
.nav { display: flex; gap: 2px; }
.nav a, .mnav a, .mnav button { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: var(--r-ctl); color: var(--ink-2); font-size: 14px; font-weight: 550; text-decoration: none; transition: background-color 0.16s var(--ease-out), color 0.16s; }
.nav a[aria-current='page'], .mnav a[aria-current='page'] { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current='page'] .i, .mnav a[aria-current='page'] .i { color: var(--accent); }
@media (hover: hover) and (pointer: fine) { .nav a:hover, .mnav a:hover, .mnav button:hover { background: var(--surface-2); color: var(--ink); } }
.top-acts { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.search-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px; border: 0; border-radius: var(--r-ctl); background: var(--surface-2); color: var(--ink-3); font-size: 13.5px; min-width: 200px; transition: background-color 0.16s, transform 0.16s var(--ease-out); }
.search-btn kbd { margin-left: auto; }
.search-btn:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { .search-btn:hover { background: var(--surface-3); color: var(--ink-2); } }
.xp-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; margin: 0 4px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 13.5px; text-decoration: none; }
.xp-chip .xp-u { font-weight: 600; font-size: 12px; }
.xp-chip.bump { animation: bump 0.45s var(--spring); }
@keyframes bump { 40% { transform: scale(1.14); } }
.theme-btn { position: relative; }
.theme-btn .sun, .theme-btn .moon { position: absolute; display: grid; transition: transform 0.3s var(--ease-out), opacity 0.2s; }
.theme-btn .moon { opacity: 0; transform: rotate(-60deg) scale(0.85); }
[data-theme='light'] .theme-btn .sun { opacity: 0; transform: rotate(60deg) scale(0.85); }
[data-theme='light'] .theme-btn .moon { opacity: 1; transform: none; }
.mnav { display: grid; gap: 2px; padding: 8px 12px 14px; }
.mnav[hidden] { display: none; }
.mnav button { border: 0; background: transparent; text-align: left; }
.only-narrow { display: none !important; }
@media (max-width: 1023px) { .only-narrow { display: inline-flex !important; } }
@media (max-width: 1199px) { .search-btn { min-width: 0; width: 38px; padding: 0; justify-content: center; } .search-btn .sb-t, .search-btn kbd { display: none; } }
@media (max-width: 999px) { .nav { display: none; } }
@media (min-width: 1000px) { [data-menu] { display: none !important; } .mnav { display: none !important; } }
@media (max-width: 999px) { [data-menu] { display: inline-grid !important; } }
@media (max-width: 640px) { .search-btn .sb-t, .search-btn kbd { display: none; } .search-btn { width: 38px; padding: 0; justify-content: center; background: transparent; color: var(--ink-2); } .hide-narrow { display: none !important; } .brand-t { display: none; } .top-in { gap: 8px; } }

/* ---------- Hero ---------- */
/* Hero: banda de portada siempre oscura (también en modo claro), imagen a sangre y texto sobre la zona vacía de la izquierda */
.hero {
  --hero-bg: rgb(4 14 37);
  color-scheme: dark; --ground: var(--hero-bg); --ink: #f2f5f9; --ink-2: #d3dae3; --accent: #7cbcff; --accent-ink: #03122a; --surface-2: rgb(255 255 255 / 0.1);
  position: relative; isolation: isolate; min-height: clamp(460px, 70vh, 720px); display: flex; align-items: center; overflow: hidden;
  background: var(--hero-bg); color: var(--ink);
}
.hero-art { position: absolute; inset: 0; z-index: -2; overflow: hidden; }
.hero-art picture, .hero-img { display: block; width: 100%; height: 100%; }
.hero-img { object-fit: cover; object-position: 78% 50%; transform-origin: 72% 46%; animation: hero-drift 36s var(--ease-in-out) infinite alternate; will-change: transform; }
@keyframes hero-drift { from { transform: scale(1.001); } to { transform: scale(1.06) translate3d(-0.8%, -0.6%, 0); } }
.hero::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(90deg, var(--hero-bg) 0%, color-mix(in srgb, var(--hero-bg) 92%, transparent) 34%, color-mix(in srgb, var(--hero-bg) 55%, transparent) 50%, transparent 68%),
              linear-gradient(0deg, color-mix(in srgb, var(--hero-bg) 70%, transparent) 0%, transparent 22%); }
.hero-copy { width: min(1160px, 100% - 40px); margin: 0 auto; padding: 56px 0; display: grid; gap: 16px; justify-items: start; }
.hero-copy > * { max-width: min(580px, 46vw); }
@media (min-width: 761px) and (max-width: 1199px) { .hero::before { background: linear-gradient(90deg, var(--hero-bg) 0%, color-mix(in srgb, var(--hero-bg) 92%, transparent) 46%, color-mix(in srgb, var(--hero-bg) 50%, transparent) 60%, transparent 76%); } .hero-copy > * { max-width: 48vw; } }
.hero-copy h1 { font-size: clamp(48px, 7.4vw, 96px); font-weight: 760; letter-spacing: -0.045em; line-height: 0.95; text-wrap: balance; }
.hero-copy .lead { max-width: 46ch; text-wrap: pretty; }
.hero-copy .cta { margin-top: 8px; gap: 10px; }
@media (hover: hover) and (pointer: fine) { .hero .btn.ghost:hover:not(:disabled) { background: rgb(255 255 255 / 0.1); color: var(--ink); } }
@media (prefers-reduced-motion: reduce) { .hero-img { animation: none; transform: none; } }
@media (max-width: 760px) {
  .hero { display: block; min-height: 0; }
  .hero-art { position: relative; height: clamp(240px, 62vw, 420px); }
  .hero-img { object-position: 84% 50%; transform-origin: 80% 50%; }
  .hero::before { inset: 0 0 auto 0; height: clamp(240px, 62vw, 420px); background: linear-gradient(0deg, var(--hero-bg) 0%, color-mix(in srgb, var(--hero-bg) 60%, transparent) 22%, transparent 48%); }
  .hero-copy { padding: 0 0 36px; margin-top: -28px; position: relative; }
  .hero-copy > * { max-width: none; }
  .hero-copy .cta .btn { flex: 1 1 100%; }
}
@media (forced-colors: active) { .hero::before { display: none; } }

/* ---------- Inicio ---------- */
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 8px; }
.stat { display: flex; gap: 14px; align-items: center; }
.stat > div { flex: 1; display: grid; gap: 4px; }
.stat-ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); flex: none; }
.stat-ic.ok { background: var(--ok-soft); color: var(--ok); }
.stat-v { font-size: 24px; font-weight: 720; letter-spacing: -0.02em; line-height: 1.1; }
.stat-l { font-size: 13px; color: var(--ink-3); }
.stat .meter { margin-top: 6px; }
.sec-h { display: grid; gap: 6px; margin: 56px 0 20px; }
.sec-h h1 { font-size: clamp(30px, 4vw, 40px); font-weight: 730; letter-spacing: -0.03em; }
.sec-h h2 { font-size: 26px; font-weight: 700; }
.sec-h.sub { margin-top: 36px; }
.sec-h.sub h2, .sec-h.sub h3 { font-size: 19px; font-weight: 680; }
.page .sec-h:first-child { margin-top: 8px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.mcard { display: grid; gap: 6px; align-content: start; color: inherit; text-decoration: none; transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out); }
.mcard h3 { font-size: 18px; font-weight: 680; }
.mcard .row.between { margin-bottom: 10px; }
.mcard:active { transform: scale(0.985); }
@media (hover: hover) and (pointer: fine) { .mcard:hover { transform: translateY(-2px); box-shadow: var(--sh-overlay); } }
.mic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.mic.lg { width: 52px; height: 52px; border-radius: 14px; }
.mic.lg .i { width: 24px; height: 24px; }
.mfoot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.how { margin-top: 56px; }
.how h2 { font-size: 26px; font-weight: 700; margin-bottom: 20px; }
.steps3 { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.steps3 li { display: grid; gap: 8px; align-content: start; }
.steps3 h3 { font-size: 17px; }
.steps3 p { color: var(--ink-2); }
.stepn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; }
.foot { display: grid; gap: 4px; padding: 48px 0 40px; color: var(--ink-3); font-size: 13px; }
@media (max-width: 760px) { .stats3, .steps3 { grid-template-columns: 1fr; } }

/* ---------- Módulo ---------- */
.mod { padding-bottom: 24px; }
.mod-h { display: grid; gap: 14px; padding: 22px 0 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); text-decoration: none; font-weight: 550; justify-self: start; }
.mod-title { display: flex; gap: 16px; align-items: center; }
.mod-title h1 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 740; letter-spacing: -0.03em; }
.mod-prog { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 720px; }
.mod-prog .meter { min-width: 140px; }
.mod-grid { display: grid; grid-template-columns: minmax(360px, 460px) minmax(0, 1fr); gap: 20px; align-items: start; }
.mod-side { display: grid; gap: 16px; min-width: 0; }
.mod-side > .seg { position: sticky; top: calc(var(--top-h) + 10px); z-index: 5; justify-self: start; box-shadow: var(--sh-raise); }
.pan { display: grid; gap: 16px; outline: none; }
.pan[hidden] { display: none; }
.mod-ws { position: sticky; top: calc(var(--top-h) + 12px); height: calc(100dvh - var(--top-h) - 24px); min-height: 520px; }
.intro { font-size: 16px; color: var(--ink-2); }
.lcard { display: grid; gap: 12px; }
.lcard h2 { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 680; }
.lcard p { color: var(--ink-2); }
.lcard strong { color: var(--ink); }
.lcard code, .tq code, .hint code, .task-fb code { padding: 1px 6px; border-radius: var(--r-chip); background: var(--surface-2); color: var(--ink); }
.ln { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; flex: none; }
.tries { display: grid; gap: 6px; margin-top: 4px; }
.tries-h { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.try { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline; text-align: left; padding: 9px 12px; border: 0; border-radius: var(--r-ctl); background: var(--surface-2); transition: transform 0.16s var(--ease-out), background-color 0.16s; }
.try code { color: var(--accent); font-weight: 600; padding: 0; background: none; }
.try span { color: var(--ink-3); font-size: 13px; }
.try:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { .try:hover { background: var(--surface-3); } }
@media (max-width: 1023px) {
  .mod-grid { grid-template-columns: 1fr; }
  .mod-ws { display: none; position: static; height: calc(100dvh - var(--top-h) - 84px); min-height: 460px; }
  .mod[data-tab='ws'] .mod-ws { display: block; }
  .mod-side > .seg { top: calc(var(--top-h) + 8px); }
}

/* Retos */
.task { display: grid; gap: 12px; transition: background-color 0.3s var(--ease-out); }
.task[data-state='done'] { background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
.task-h { display: flex; align-items: center; gap: 10px; }
.tnum { position: relative; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 99px; background: var(--surface-3); font-size: 13px; font-weight: 700; flex: none; }
.tn-ok { position: absolute; inset: 0; display: grid; place-items: center; border-radius: inherit; background: var(--ok); color: var(--ok-ink); opacity: 0; transform: scale(0.4); }
.task[data-state='done'] .tn-ok { opacity: 1; transform: none; }
.task.just .tn-ok { animation: pop 0.5s var(--spring); }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } }
.ttype { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.txp { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
.task[data-state='done'] .txp { color: var(--ok); }
.tq { font-size: 15.5px; }
.task-act { display: grid; gap: 10px; justify-items: start; }
.task[data-state='done'] .task-act > .btn, .task[data-state='done'] .ans .btn { display: none; }
.ans { display: flex; gap: 8px; width: 100%; }
.tinput { flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: 0; border-radius: var(--r-ctl); background: var(--surface-2); box-shadow: inset 0 0 0 1px transparent; transition: box-shadow 0.16s, background-color 0.16s; }
.tinput:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); background: var(--surface); }
.tinput:disabled { opacity: 0.7; }
.opts { display: grid; gap: 6px; width: 100%; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: var(--r-ctl); background: var(--surface-2); transition: transform 0.16s var(--ease-out), background-color 0.16s, color 0.16s; }
.opt:active:not(:disabled) { transform: scale(0.985); }
.ob { width: 16px; height: 16px; border-radius: 99px; box-shadow: inset 0 0 0 2px var(--ink-3); flex: none; transition: box-shadow 0.2s var(--ease-out); }
.opt.right { background: var(--ok-soft); color: var(--ok); font-weight: 600; opacity: 1; }
.opt.right .ob { box-shadow: inset 0 0 0 5px var(--ok); }
.opt.wrong { background: var(--bad-soft); color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--bad); }
.opt.wrong .ob { box-shadow: inset 0 0 0 2px var(--bad); }
.opt:disabled:not(.right):not(.wrong) { opacity: 0.6; }
@media (hover: hover) and (pointer: fine) { .opt:hover:not(:disabled) { background: var(--surface-3); } }
.task-fb:empty { display: none; }
.task-fb { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-ctl); font-size: 14px; animation: fade 0.2s var(--ease-out); }
.task-fb .i { margin-top: 2px; }
.task-fb.ok { background: var(--ok-soft); color: var(--ok); font-weight: 550; }
.task-fb.ok strong { color: inherit; }
.task-fb.bad { background: var(--bad-soft); color: var(--bad); }
@keyframes fade { from { opacity: 0; transform: translateY(-3px); } }
.task.nope { animation: nope 0.32s var(--ease-out); }
@keyframes nope { 20% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }
.task-hints { display: grid; gap: 6px; }
.task-hints:empty { display: none; }
.hint { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: var(--r-ctl); background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.hint .i { margin-top: 3px; color: var(--accent); }
.hint.new { animation: fade 0.24s var(--ease-out); }
.task-foot { display: flex; justify-content: flex-end; margin-top: -4px; }
.task-foot .btn[hidden] { display: none; }
.mod-end { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.mod-end > .i { width: 36px; height: 36px; color: var(--ok); }
.mod-end > div { flex: 1; min-width: 180px; }
.mod-end h2 { font-size: 18px; color: var(--ok); }

/* Diagrama de escalera */
.ladder { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: var(--surface-2); }
.ladder svg { width: 100%; height: auto; display: block; overflow: visible; }
.ladder .lh { font: 650 13px var(--font-sans); fill: var(--ink); }
.ladder .lh2 { font: 11px var(--font-mono); fill: var(--ink-3); }
.ladder .life { stroke: var(--ink-4); stroke-width: 1.5; stroke-dasharray: 3 4; }
.ladder .ph rect { fill: var(--surface-3); }
.ladder .ph text { font: 650 11px var(--font-sans); fill: var(--ink-2); letter-spacing: 0.02em; }
.ladder .ar { stroke: var(--ink-2); stroke-width: 1.6; stroke-linecap: round; }
.ladder .hd { fill: var(--ink-2); }
.ladder .sl { font: 650 12px var(--font-sans); fill: var(--ink); }
.ladder .sn { font: 10.5px var(--font-mono); fill: var(--ink-3); }
.ladder .step { cursor: pointer; outline: none; }
.ladder .step.app .ar { stroke: var(--ok); } .ladder .step.app .hd { fill: var(--ok); }
.ladder .step.rst .ar { stroke: var(--bad); } .ladder .step.rst .hd { fill: var(--bad); }
.ladder .step.on .ar, .ladder .step:focus-visible .ar { stroke: var(--accent); stroke-width: 2.4; }
.ladder .step.on .hd, .ladder .step:focus-visible .hd { fill: var(--accent); }
.ladder .step.on .sl, .ladder .step:focus-visible .sl { fill: var(--accent); }
@media (hover: hover) and (pointer: fine) { .ladder .step:hover .sl { fill: var(--accent); } .ladder .step:hover .ar { stroke: var(--accent); } .ladder .step:hover .hd { fill: var(--accent); } }
.ladder.play .step { animation: stepIn 0.32s var(--ease-out) both; animation-delay: var(--d); }
.ladder.play .step .ar { stroke-dasharray: 1; animation: draw 0.36s var(--ease-out) both; animation-delay: var(--d); }
@keyframes stepIn { from { opacity: 0; } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

/* ---------- Segmentos, interruptores, selects ---------- */
.seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface-2); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-3); font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: background-color 0.18s var(--ease-out), color 0.18s, box-shadow 0.18s; }
.seg button[aria-selected='true'], .seg button[aria-checked='true'] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-raise); }
[data-theme='dark'] .seg button[aria-selected='true'], [data-theme='dark'] .seg button[aria-checked='true'] { background: var(--surface-3); }
.seg button .num { font-size: 12px; color: var(--ink-3); }
.seg.sm button { height: 30px; font-size: 13px; }
.switch { position: relative; width: 46px; height: 28px; padding: 0; border: 0; border-radius: 99px; background: var(--surface-3); flex: none; transition: background-color 0.2s var(--ease-out); }
.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 99px; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.3); transition: transform 0.24s var(--spring); }
.switch[aria-checked='true'] { background: var(--accent); }
.switch[aria-checked='true'] i { transform: translateX(18px); }
.sel { height: 36px; padding: 0 10px; border: 0; border-radius: var(--r-ctl); background: var(--surface-2); color: var(--ink); max-width: 100%; }
select { accent-color: var(--accent); min-height: 32px; padding: 4px 8px; border: 0; border-radius: 8px; background: var(--surface-2); color: var(--ink); box-shadow: var(--sh-raise); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 600; transition: background-color 0.16s, color 0.16s; }
.chip .num { color: var(--ink-3); font-weight: 500; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip.on .num { color: inherit; opacity: 0.85; }

/* ---------- Espacio de trabajo (Wireshark) ---------- */
.ws { position: relative; display: flex; flex-direction: column; height: 100%; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--sh-panel); overflow: hidden; }
.ws-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 10px 6px; align-items: center; }
.fbar { position: relative; flex: 1 1 380px; display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 4px 0 10px; border-radius: var(--r-ctl); background: var(--surface-2); transition: background-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out); }
.fbar:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.fbar[data-state='ok'] { background: color-mix(in srgb, var(--ok) 16%, var(--surface-2)); }
.fbar[data-state='bad'] { background: color-mix(in srgb, var(--bad) 16%, var(--surface-2)); }
.fbar[data-state='ok']:focus-within { box-shadow: 0 0 0 2px var(--ok); }
.fbar[data-state='bad']:focus-within { box-shadow: 0 0 0 2px var(--bad); }
.fbar.shake { animation: nope 0.3s var(--ease-out); }
.fbar-ic { display: grid; color: var(--ink-3); }
.fbar[data-state='ok'] .fbar-ic { color: var(--ok); }
.fbar[data-state='bad'] .fbar-ic { color: var(--bad); }
.finput { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: 13.5px; outline: none; }
.finput::placeholder { color: var(--ink-3); font-family: var(--font-sans); }
.fbar [data-clear] { opacity: 0.75; }
.fbar[data-state='empty'] [data-clear] { visibility: hidden; }
.ac { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0; max-height: 300px; overflow: auto; margin: 0; padding: 6px; list-style: none; border-radius: 12px; background: var(--glass-thick); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: var(--sh-overlay); animation: acIn 0.16s var(--ease-out); transform-origin: top center; }
@keyframes acIn { from { opacity: 0; transform: scale(0.98) translateY(-4px); } }
.ac li { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.ac li code { color: var(--accent); font-weight: 600; white-space: nowrap; }
.ac li span { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac li[aria-selected='true'] { background: var(--accent-soft); }
@media (hover: hover) and (pointer: fine) { .ac li:hover { background: var(--surface-2); } }
.ws-tools { display: flex; gap: 4px; flex-wrap: wrap; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; transition: background-color 0.16s, color 0.16s, transform 0.16s var(--ease-out); }
.tbtn:active { transform: scale(0.96); }
.tbtn[aria-pressed='true'] { color: var(--accent); }
@media (hover: hover) and (pointer: fine) { .tbtn:hover { background: var(--surface-2); color: var(--ink); } }
.fmsg { display: flex; gap: 6px; align-items: center; min-height: 0; margin: 0 12px; font-size: 13px; }
.fmsg:empty { display: none; }
.fmsg.bad { color: var(--bad); padding: 2px 0 6px; }
.ws-panes { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(140px, 1.3fr) minmax(110px, 1fr) minmax(90px, 0.7fr); gap: 6px; padding: 0 8px; }
.pane { position: relative; min-height: 0; border-radius: 12px; background: var(--ground); overflow: hidden; }
[data-theme='light'] .pane { background: var(--surface-2); }
.pane.plist { display: flex; flex-direction: column; outline: none; overflow: auto; overscroll-behavior: contain; }
.plist:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.prow { display: grid; grid-template-columns: 52px 86px minmax(96px, 1fr) minmax(96px, 1fr) 76px 54px minmax(180px, 3fr); align-items: center; gap: 8px; height: 28px; padding: 0 10px; font: 12.5px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.prow > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .c-no, .prow .c-l { text-align: right; }
.phead { flex: none; position: sticky; top: 0; z-index: 2; height: 30px; font: 600 12px var(--font-sans); color: var(--ink-3); background: var(--surface-3); }
.pbody { position: relative; flex: 1 0 auto; }
.pspacer { width: 1px; }
.pbody .prow { position: absolute; top: 0; left: 0; right: 0; cursor: default; color: var(--ink); }
.pempty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 14px; }
.pempty[hidden] { display: none; }
.c-tcp { background: var(--pk-tcp); } .c-http { background: var(--pk-http); } .c-udp { background: var(--pk-udp); } .c-arp { background: var(--pk-arp); }
.c-synfin { background: var(--pk-synfin); } .c-smb { background: var(--pk-smb); } .c-icmp { background: var(--pk-icmp); }
.pbody .c-rst { background: var(--pk-rst); color: var(--pk-rst-ink); } .pbody .c-bad { background: var(--pk-bad); color: var(--pk-bad-ink); }
.nocolor .pbody .prow { background: transparent; color: var(--ink); }
.nocolor .pbody .prow:nth-child(odd) { background: color-mix(in srgb, var(--surface-3) 45%, transparent); }
.pbody .prow[aria-selected='true'] { background: var(--accent); color: var(--accent-ink); }
@media (hover: hover) and (pointer: fine) { .pbody .prow:hover:not([aria-selected='true']) { box-shadow: inset 0 0 0 100px rgb(127 127 127 / 0.12); } }
.ptree { overflow: auto; }
.pane-empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; color: var(--ink-3); font-size: 14px; text-align: center; }
.pane-empty[hidden] { display: none; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { padding: 6px; outline: none; min-height: 100%; }
.tree ul { padding-left: 18px; }
.tree ul[hidden] { display: none; }
.tn { display: flex; align-items: center; gap: 2px; min-height: 26px; padding: 2px 4px 2px 2px; border-radius: 7px; font: 12.5px/1.35 var(--font-mono); cursor: default; }
.tw { display: grid; place-items: center; width: 20px; height: 20px; flex: none; color: var(--ink-3); border-radius: 5px; }
.tw .i { transition: transform 0.18s var(--ease-out); }
[aria-expanded='true'] > .tn .tw .i { transform: rotate(90deg); }
.tl { flex: 1; min-width: 0; overflow-wrap: anywhere; }
li[aria-level='1'] > .tn .tl { font-weight: 650; font-family: var(--font-sans); font-size: 13px; }
.tf { display: grid; place-items: center; width: 26px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--ink-3); opacity: 0; transition: opacity 0.12s, background-color 0.12s; }
[aria-selected='true'] > .tn { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
[aria-selected='true'] > .tn .tf, .tf:focus-visible { opacity: 1; color: var(--accent); }
.tree:focus-visible [aria-selected='true'] > .tn { box-shadow: inset 0 0 0 2px var(--accent); }
@media (hover: hover) and (pointer: fine) { .tn:hover { background: rgb(127 127 127 / 0.1); } .tn:hover .tf { opacity: 1; } .tf:hover { background: var(--accent-soft); color: var(--accent); } }
@media (hover: none) { .tf { opacity: 0.8; } }
.phex { overflow: auto; outline: none; }
.phex:focus-visible, .tbl-wrap:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); outline: none; }
.hex { padding: 8px 10px; font-size: 12.5px; line-height: 1.55; }
.hl-row { display: flex; gap: 14px; white-space: pre; }
.hl-row .off { color: var(--ink-3); }
.hx span, .as span { cursor: pointer; border-radius: 3px; }
.hx span { padding: 0 2px; }
.hx .gap { padding: 0 3px; cursor: default; }
.hx .pad { cursor: default; }
.as { color: var(--ink-2); }
.hex .on2 { background: var(--accent-soft); }
.hex .on { background: var(--accent); color: var(--accent-ink); }
.ws-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 14px 9px; font-size: 12.5px; color: var(--ink-3); }
.ws-status strong { color: var(--ink); font-weight: 650; }
.ws-status .dot { width: 3px; height: 3px; border-radius: 9px; background: var(--ink-4); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.lg i { width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgb(127 127 127 / 0.35); }
.lg.c-rst, .lg.c-bad, .lg[class*='c-'] { background: none; color: inherit; }
.lg.c-tcp i { background: var(--pk-tcp); } .lg.c-http i { background: var(--pk-http); } .lg.c-udp i { background: var(--pk-udp); } .lg.c-arp i { background: var(--pk-arp); } .lg.c-synfin i { background: var(--pk-synfin); }
.lg.c-smb i { background: var(--pk-smb); } .lg.c-icmp i { background: var(--pk-icmp); } .lg.c-rst i { background: var(--pk-rst); } .lg.c-bad i { background: var(--pk-bad); }
.drop { position: absolute; inset: 0; z-index: 25; display: grid; place-content: center; justify-items: center; gap: 10px; background: color-mix(in srgb, var(--accent) 18%, var(--glass-thick)); color: var(--accent); font-weight: 650; font-size: 16px; border-radius: inherit; }
.drop[hidden] { display: none; }
.drop .i { width: 32px; height: 32px; }
@media (max-width: 1280px) { .prow { grid-template-columns: 44px 76px minmax(90px, 1fr) minmax(90px, 1fr) 64px 46px minmax(160px, 2.6fr); gap: 6px; } }
@media (max-width: 760px) {
  .tbtn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .tbtn { width: 38px; padding: 0; justify-content: center; }
  .ws-tools { width: 100%; justify-content: space-between; }
  .prow { grid-template-columns: 34px minmax(78px, 1fr) minmax(78px, 1fr) 56px minmax(150px, 2fr); gap: 6px; padding: 0 6px; font-size: 12px; }
  .prow .c-t, .prow .c-l { display: none; }
  .fbar [data-apply] span { display: none; }
  .legend { display: none; }
}

/* ---------- Laboratorio ---------- */
.lab { display: grid; gap: 14px; padding: 18px 0 20px; }
.lab-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.lab-h h1 { font-size: 28px; font-weight: 730; letter-spacing: -0.03em; }
.lab-ws { height: calc(100dvh - var(--top-h) - 120px); min-height: 520px; }

/* ---------- Chuleta y glosario ---------- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 16px; }
.cs h2 { font-size: 18px; font-weight: 680; margin-bottom: 10px; }
.cs ul { list-style: none; padding: 0; display: grid; gap: 2px; }
.cs li { display: flex; gap: 10px; align-items: center; padding: 8px 8px 8px 10px; border-radius: var(--r-ctl); transition: background-color 0.16s; }
.cs li:nth-child(odd) { background: var(--surface-2); }
.cs-f { flex: 1; min-width: 0; display: grid; gap: 2px; }
.cs-f code { color: var(--accent); font-weight: 600; }
.cs-f p { font-size: 13.5px; color: var(--ink-2); }
.cs-a { display: flex; gap: 2px; }
.cs.fields { margin-top: 16px; }
.gsearch { display: flex; align-items: center; gap: 10px; max-width: 520px; padding-left: 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--sh-panel); color: var(--ink-3); margin-bottom: 8px; }
.gsearch .tinput { background: transparent; height: 46px; padding-left: 0; }
.gsearch .tinput:focus { box-shadow: none; }
.gsearch:focus-within { box-shadow: 0 0 0 2px var(--accent), var(--sh-panel); }
.gl { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; margin-top: 12px; }
.gi { display: grid; gap: 6px; align-content: start; padding: 16px 18px; }
.gi[hidden] { display: none; }
.gi dt { font-weight: 700; }
.gi dd { color: var(--ink-2); font-size: 14.5px; }
.gi.flash { animation: flash 1.4s var(--ease-out); }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 2px var(--accent), var(--sh-panel); } }

/* ---------- Tablas ---------- */
.tbl-wrap { overflow: auto; border-radius: 12px; max-height: 58vh; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tbl th { position: sticky; top: 0; z-index: 1; text-align: left; padding: 9px 10px; background: var(--surface-3); color: var(--ink-2); font-weight: 650; font-size: 12.5px; white-space: nowrap; }
.tbl td { padding: 7px 10px; vertical-align: middle; }
.tbl tbody tr:nth-child(even) td { background: var(--surface-2); }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl.keys th { position: static; background: none; width: 40%; }
.tbl.keys td, .tbl.keys th { padding: 8px 6px; }
.bar-col { width: 28%; }
.bar { display: block; height: 8px; min-width: 2px; border-radius: 99px; background: var(--accent); }

/* ---------- Diálogos ---------- */
.dlg { width: min(600px, calc(100% - 24px)); max-width: none; max-height: none; padding: 0; border: 0; background: transparent; color: var(--ink); overflow: visible; }
.dlg.wide { width: min(1000px, calc(100% - 24px)); }
.dlg.narrow { width: min(460px, calc(100% - 24px)); }
.dlg.search { width: min(680px, calc(100% - 24px)); margin-top: 12vh; }
.dlg::backdrop { background: rgb(4 8 14 / 0.5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.dlg[open] .dlg-in { animation: dlgIn 0.22s var(--ease-out); }
.dlg[open]::backdrop { animation: fadeIn 0.2s var(--ease-out); }
.dlg.closing .dlg-in { animation: dlgOut 0.15s ease-in forwards; }
.dlg.closing::backdrop { animation: fadeOut 0.15s ease-in forwards; }
@keyframes dlgIn { from { opacity: 0; transform: scale(0.96) translateY(6px); } }
@keyframes dlgOut { to { opacity: 0; transform: scale(0.97); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
.dlg-in { display: flex; flex-direction: column; max-height: min(86dvh, 900px); border-radius: var(--r-dlg); background: var(--surface); box-shadow: var(--sh-overlay); overflow: hidden; }
.dlg-h { display: flex; align-items: center; gap: 12px; padding: 16px 14px 10px 22px; }
.dlg-h h2 { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 680; }
.dlg-h h2 .i { color: var(--accent); }
.dlg-b { padding: 4px 22px 20px; overflow: auto; display: grid; gap: 14px; align-content: start; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; background: var(--surface-2); flex-wrap: wrap; }
.lead-sm { color: var(--ink-2); }
.choice { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--surface-2); text-align: left; transition: background-color 0.16s, transform 0.16s var(--ease-out); }
.choice span { display: grid; gap: 2px; }
.choice small { color: var(--ink-3); font-size: 13px; }
.choice .i { color: var(--accent); }
.choice:active:not(:disabled) { transform: scale(0.985); }
.choice:disabled { opacity: 0.5; }
@media (hover: hover) and (pointer: fine) { .choice:hover:not(:disabled) { background: var(--surface-3); } }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; flex-wrap: wrap; }
.set-row + .set-row { box-shadow: 0 -1px 0 var(--surface-2); }
.set-row > div:first-child { flex: 1; min-width: 200px; display: grid; gap: 2px; }
.set-row > div:first-child > p:first-child { font-weight: 600; }
.danger-zone { margin-top: 6px; padding: 14px; border-radius: 12px; background: var(--bad-soft); }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.help section { display: grid; gap: 6px; align-content: start; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.help h3 { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.help h3 .i { color: var(--accent); }
.help p { color: var(--ink-2); font-size: 14px; }
.celebrate .dlg-b { justify-items: center; padding-top: 10px; }
.badge-big { display: grid; place-items: center; width: 92px; height: 92px; border-radius: 28px; background: var(--ok-soft); color: var(--ok); animation: badge 0.7s var(--spring) both; }
.badge-big .i { width: 46px; height: 46px; }
@keyframes badge { from { opacity: 0; transform: scale(0.5) rotate(-12deg); } }
.badge-name { font-size: 22px; font-weight: 750; color: var(--ok); letter-spacing: -0.02em; }
/* Follow Stream */
.fs-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.fs-ends { display: flex; gap: 8px; flex-wrap: wrap; }
.who { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.who.cli { background: var(--cli-bg); color: var(--cli); }
.who.srv { background: var(--srv-bg); color: var(--srv); }
.who code { font-weight: 500; }

[data-theme='light'] .fs-body { background: var(--surface-2); }

.fs-body pre.cli { background: var(--cli-bg); color: var(--cli); }
.fs-body pre.srv { background: var(--srv-bg); color: var(--srv); }

.lgd { display: inline-flex; align-items: center; gap: 6px; }
.lgd i { width: 12px; height: 12px; border-radius: 3px; }

.sbox:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.sres { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; max-height: 52vh; overflow: auto; }

.s-t small { color: var(--ink-3); font-size: 12.5px; }
.s-k { font-size: 11.5px; font-weight: 650; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.s-none { color: var(--ink-3); cursor: default !important; }
.s-foot { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

  .btn:active, .ibtn:active, .tbtn:active, .try:active, .opt:active, .choice:active, .mcard:active { transform: none !important; }
  .toast { transform: none !important; }
}
@media (forced-colors: active) { .fbar, .card, .btn, .tinput, .pane { border: 1px solid CanvasText; } .pbody .prow[aria-selected='true'] { forced-color-adjust: none; background: Highlight; color: HighlightText; } }
/* ---------- Megalodón 3D del hero (src/app/48-shark.js) ---------- */
.shark-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.6s var(--ease-out); }
.hero-art.live .shark-cv { opacity: 1; }
.hero-art.live picture { visibility: hidden; }
.hero-art.live .hero-img { animation: none; }
.shark-callouts { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 0.5s var(--ease-out); }
.hero.blue .shark-callouts { opacity: 1; }
.shark-callouts text { font: 500 11.5px var(--font-mono); letter-spacing: 0.03em; fill: #cfe9ff; }
.shark-callouts text.k { font-weight: 600; fill: #fff; }

.shark-callouts .dot { fill: #57dc98; }
.shark-callouts .plate { fill: rgb(2 14 32 / 0.78); stroke: rgb(150 205 255 / 0.3); }
.shark-hud { position: absolute; right: max(16px, calc((100% - 1160px) / 2)); bottom: 20px; display: flex; gap: 6px; align-items: center; padding: 4px; border-radius: 12px; background: rgb(4 14 37 / 0.62); box-shadow: var(--sh-raise); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); }

@media (max-width: 760px) { .shark-hud { top: 12px; bottom: auto; right: 12px; } .shark-callouts { height: clamp(240px, 62vw, 420px); } }

/* Reglas de color (orden y espíritu de las de Wireshark) */
const COLOR_RULES = [
  { id: 'bad', name: 'Bad TCP', filter: 'tcp.analysis.retransmission', test: p => p.f['tcp.analysis.retransmission'] },
  { id: 'rst', name: 'TCP RST', filter: 'tcp.flags.reset == 1', test: p => p.f['tcp.flags.reset'] && p.f['tcp.flags.reset'][0] },
  { id: 'arp', name: 'ARP', filter: 'arp', test: p => p.f.arp },
  { id: 'icmp', name: 'ICMP', filter: 'icmp', test: p => p.f.icmp },
  { id: 'smb', name: 'SMB / Kerberos', filter: 'smb2 || kerberos', test: p => p.f.smb2 || p.f.kerberos },
  { id: 'http', name: 'HTTP', filter: 'http || tcp.port == 80', test: p => p.f.http || (p.f['tcp.port'] && p.f['tcp.port'].includes(80)) },
  { id: 'synfin', name: 'TCP SYN/FIN', filter: 'tcp.flags.syn == 1 || tcp.flags.fin == 1', test: p => p.f['tcp.flags'] && (p.f['tcp.flags'][0] & 3) },
  { id: 'tcp', name: 'TCP', filter: 'tcp', test: p => p.f.tcp },
  { id: 'udp', name: 'UDP', filter: 'udp', test: p => p.f.udp },
];
function colorOf(p) { const r = COLOR_RULES.find(r => r.test(p)); return r ? r.id : ''; }

      { id: 'm1-syn', type: 'filter', q: 'Muestra solo los paquetes que **abren** una conexión: SYN activado y ACK apagado.', ref: 'tcp.flags.syn==1 && tcp.flags.ack==0', hints: ['Necesitas dos condiciones unidas con `&&`.', 'Compara cada flag con 1 o 0: `tcp.flags.syn == 1` …', '`tcp.flags.syn==1 && tcp.flags.ack==0`'], ok: 'Exacto: tres intentos de conexión. Es el filtro que usarás para ver quién escanea a quién.' },
      { id: 'm1-port', type: 'text', q: '¿Qué **puerto de origen** usa Kali en la primera conexión al puerto 80?', ans: ['52056'], proof: 'tcp.srcport == 52056 && tcp.dstport == 80 && tcp.stream == 0', hints: ['Mira la columna Info del paquete 7: «origen → destino».', 'El número a la izquierda de la flecha.'], ok: 'Bien: 52056 es un puerto efímero, elegido por el sistema para esta conexión.' },
      { id: 'm1-synack', type: 'packet', q: 'Selecciona en la lista el **SYN, ACK** con el que el servidor acepta la primera conexión.', match: 'tcp.stream == 0 && tcp.flags.syn == 1 && tcp.flags.ack == 1', hints: ['Es el segundo paso del saludo.', 'Paquete 8: 80 → 52056 [SYN, ACK].'], ok: 'Ese es: el servidor acepta y propone su propio número de secuencia.' },
      { id: 'm1-ack', type: 'text', q: 'La petición GET (paquete 10) lleva `Seq=1` y `Len=137`. ¿Qué número de **Ack** relativo usa el servidor para confirmarla?', ans: ['138'], proof: 'tcp.stream == 0 && tcp.ack == 138', hints: ['Ack = siguiente byte que el servidor espera.', 'Suma Seq + Len.'], ok: '1 + 137 = 138. Ya sabes leer el «diálogo» de bytes de TCP.' },
      { id: 'm1-stream', type: 'filter', q: 'Aísla la **primera conversación TCP** completa (saludo, petición, respuesta y cierre).', ref: 'tcp.stream eq 0', hints: ['Cada conversación TCP tiene un índice que empieza en 0.', 'El campo es `tcp.stream`.'], ok: 'Once paquetes de principio a fin. Prueba ahora «Seguir flujo TCP» sobre cualquiera de ellos.' },
      { id: 'm1-rst', type: 'choice', q: 'El intento al puerto 8080 recibe **[RST, ACK]**. ¿Qué significa?', opts: ['El puerto está abierto y el servidor acepta', 'El puerto está cerrado: el equipo existe pero nadie escucha ahí', 'Un cortafuegos ha descartado el paquete en silencio', 'La conexión se cerró de forma educada'], ans: 1, hints: ['Un cortafuegos que descarta no responde nada.'], ok: 'Correcto. Abierto = SYN,ACK; cerrado = RST; filtrado = silencio (o un ICMP de error).' },
      { id: 'm1-fin', type: 'filter', q: 'Muestra los paquetes con el flag **FIN** activado.', ref: 'tcp.flags.fin == 1', hints: ['Igual que con SYN, pero con otro flag.', '`tcp.flags.fin == 1`'], ok: 'Cuatro FIN: dos por cada conexión que se cerró bien.' },
      { id: 'm1-count', type: 'text', q: '¿Cuántas **conversaciones TCP** hay en la captura? Pista: Estadísticas → Conversaciones.', ans: ['3', 'tres'], proof: 'tcp.stream == 2', hints: ['Abre Estadísticas y mira la pestaña TCP.', 'También puedes probar `tcp.stream eq 2` y `tcp.stream eq 3`.'], ok: 'Tres: la visita a la web, el intento al 8080 y la petición del favicon.' },

      { h: 'Petición y respuesta', p: ['Una petición HTTP empieza con la **línea de petición**: método, ruta y versión, por ejemplo `GET /login HTTP/1.1`. Debajo van las cabeceras y, tras una línea vacía, el cuerpo (si lo hay).', 'La respuesta empieza con la **línea de estado**: `HTTP/1.1 200 OK`. Wireshark enlaza cada respuesta con su petición: en el árbol verás «Petición en la trama» y la URI pedida.'], try: [['http.request', 'Solo peticiones'], ['http.response', 'Solo respuestas']] },
      { h: 'Métodos', p: ['**GET** pide un recurso (los parámetros viajan en la URL). **POST** envía datos en el cuerpo, como un formulario de login. **PUT** sube o reemplaza, **DELETE** borra, **HEAD** pide solo cabeceras y **OPTIONS** pregunta qué métodos se aceptan.', 'El campo es `http.request.method`. Los textos se comparan entre comillas: `http.request.method == "POST"`.'], try: [['http.request.method == "POST"', 'Formularios enviados'], ['http.request.method == "PUT"', 'Actualizaciones']] },
      { h: 'Cabeceras que importan', p: ['**Host**: a qué web va la petición. **User-Agent**: qué programa dice ser el cliente (un navegador, curl, una herramienta de ataque…). **Referer**: de qué página venías. **Cookie** y **Set-Cookie**: la sesión. **Location**: a dónde te redirige el servidor.', 'Cada una tiene su campo: `http.host`, `http.user_agent`, `http.referer`, `http.cookie`, `http.set_cookie`, `http.location`. Con `contains` buscas un trozo de texto: `http.user_agent contains "Firefox"`.'], try: [['http.host == "tienda.ewpt.local"', 'Peticiones a la tienda'], ['http.cookie', 'Peticiones con cookie']] },
      { h: 'Códigos de estado', p: ['**2xx** todo bien (200 OK). **3xx** redirección (301 permanente, 302 temporal: típico tras un login). **4xx** error del cliente (401 falta autenticación, 403 prohibido, 404 no existe). **5xx** error del servidor (500: algo ha petado; en una auditoría, una pista de oro).', 'Puedes compararlos como números: `http.response.code >= 400` muestra todos los errores.'], try: [['http.response.code >= 400', 'Errores'], ['http.response.code in {301, 302}', 'Redirecciones']] },
      { h: 'Seguir el flujo', p: ['Leer paquete a paquete cansa. Selecciona cualquier paquete de una conversación y pulsa **Seguir flujo TCP**: verás la conversación como texto, con lo que envía el cliente en un color y lo que responde el servidor en otro.', 'Es la forma más rápida de reconstruir una página, ver un formulario completo o leer una respuesta JSON.'], try: [['tcp.stream eq 0', 'La sesión de Marta']] },

    tasks: [
      { id: 'm2-req', type: 'filter', q: 'Muestra **solo las peticiones** HTTP (sin las respuestas).', ref: 'http.request', hints: ['Hay un campo que solo existe en las peticiones.', '`http.request`'], ok: 'Ese es el punto de partida de casi cualquier análisis web.' },
      { id: 'm2-post', type: 'filter', q: 'Filtra las peticiones con método **POST**.', ref: 'http.request.method == "POST"', hints: ['El campo es `http.request.method`.', 'El valor va entre comillas: `"POST"`.'], ok: 'Un POST a /login: ahí viajan las credenciales del formulario.' },
      { id: 'm2-ua', type: 'text', q: '¿Qué **navegador** dice usar Marta en su User-Agent?', ans: ['firefox', 'mozilla firefox'], proof: 'http.user_agent contains "Firefox"', hints: ['Abre la cabecera User-Agent de cualquier petición.', 'Busca la última palabra antes de la versión.'], ok: 'Firefox. El User-Agent lo pone el cliente: sirve de pista, pero se puede falsificar.' },
      { id: 'm2-err', type: 'filter', q: 'Muestra todas las **respuestas de error** (códigos 400 o superiores).', ref: 'http.response.code >= 400', hints: ['Los códigos se comparan como números.', '`http.response.code >= 400`'], ok: '403, 404 y 500: tres pistas de cómo está montada la aplicación.' },
      { id: 'm2-loc', type: 'text', q: 'Tras el login, el servidor responde **302**. ¿A qué ruta redirige (cabecera Location)?', ans: ['/panel', 'panel'], proof: 'http.location == "/panel"', hints: ['Filtra `http.response.code == 302` y abre las cabeceras.'], ok: '/panel. El 302 con Set-Cookie es la firma clásica de un login correcto.' },
      { id: 'm2-500', type: 'packet', q: 'Selecciona la respuesta **500 Internal Server Error**.', match: 'http.response.code == 500', hints: ['Filtra por código de estado y selecciona el resultado.'], ok: 'Un 500 tras un PUT: el servidor no supo procesar lo que le enviaron. Merece una mirada más a fondo.' },
      { id: 'm2-title', type: 'text', q: 'Sigue el flujo de la sesión de Marta. ¿Cuál es el **título** (<title>) de la página /panel?', ans: ['panel de marta'], proof: 'http.file_data contains "Panel de Marta"', hints: ['Selecciona un paquete del flujo 0 y pulsa Seguir flujo TCP.', 'Busca la etiqueta <title> en la respuesta a GET /panel.'], ok: 'Reconstruir páginas desde el tráfico es exactamente lo que hace Follow Stream.' },
      { id: 'm2-301', type: 'choice', q: '/ofertas-2024 responde **301**. ¿Qué te está diciendo el servidor?', opts: ['Que no tienes permiso', 'Que el recurso se ha movido de forma permanente a otra URL', 'Que el servidor ha fallado', 'Que la petición ha ido bien y aquí tienes el contenido'], ans: 1, hints: ['Los 3xx son redirecciones.'], ok: 'Exacto: 301 es permanente y el navegador seguirá la cabecera Location.' },

    lessons: [
      { h: 'Cookies: la memoria de la web', p: ['HTTP no recuerda quién eres entre peticiones. Tras el login, el servidor te da una **cookie de sesión** con `Set-Cookie` y tu navegador la devuelve en cada petición con `Cookie`. Quien tenga esa cookie **es** tú para el servidor.', 'Los atributos de la cookie importan: **HttpOnly** impide que JavaScript la lea (frena el robo por XSS), **Secure** obliga a enviarla solo por HTTPS y **SameSite** limita los envíos desde otras webs.'], try: [['http.set_cookie', 'El servidor reparte cookies'], ['http.cookie contains "PHPSESSID"', 'El cliente las devuelve']] },
      { h: 'Basic Auth no es cifrado', p: ['Cuando una web responde **401 Unauthorized** con `WWW-Authenticate: Basic`, el navegador pide usuario y contraseña y los envía en la cabecera `Authorization: Basic …`.', 'Eso de después de «Basic» es **Base64**, una forma de escribir bytes con letras, **no un cifrado**. Wireshark lo decodifica por ti en el campo `http.authbasic`.'], try: [['http.authorization', 'Cabeceras Authorization'], ['http.authbasic', 'Credenciales Basic decodificadas']] },

      { h: 'FTP y la caza por texto', p: ['FTP es de los años 70 y se nota: el usuario va en `USER` y la contraseña en `PASS`, en claro. Telnet, POP3 o IMAP sin TLS tienen el mismo problema.', 'Para cazar secretos en cualquier protocolo, busca texto en los bytes de la trama: `frame contains "pass"`. Y con `matches` usas expresiones regulares sin distinguir mayúsculas: `frame matches "pass(word)?"`.'], try: [['ftp', 'Todo FTP'], ['frame matches "pass"', 'Cualquier cosa que diga pass']] },

      { id: 'm3-auth', type: 'filter', q: 'Muestra las peticiones que llevan cabecera **Authorization**.', ref: 'http.authorization', hints: ['Un campo solo, sin comparación, comprueba que existe.'], ok: 'Una sola: el segundo intento tras el 401.' },
      { id: 'm3-401', type: 'packet', q: 'Selecciona la respuesta que **pide autenticación** (401).', match: 'http.response.code == 401', hints: ['`http.response.code == 401`'], ok: 'El 401 con WWW-Authenticate: Basic es el que hace saltar la ventanita de usuario y contraseña.' },
      { id: 'm3-form', type: 'text', q: '¿Qué **contraseña** escribe lucia en el formulario de /login.php?', ans: ['Primavera2024'], exact: true, proof: 'urlencoded-form.value == "Primavera2024"', hints: ['Filtra `urlencoded-form`.', 'Busca el valor del campo «pass».'], ok: 'Primavera2024. Un formulario sin HTTPS deja la contraseña a la vista de cualquiera en la red.' },
      { id: 'm3-cookie', type: 'text', q: '¿Qué **valor** tiene la cookie PHPSESSID que entrega el servidor?', ans: ['k3v1n0t5ecure8a2b', 'PHPSESSID=k3v1n0t5ecure8a2b'], exact: true, proof: 'http.set_cookie contains "k3v1n0t5ecure8a2b"', hints: ['Filtra `http.set_cookie`.', 'Copia lo que va entre «PHPSESSID=» y el primer «;».'], ok: 'Con ese valor podrías secuestrar la sesión de lucia (session hijacking).' },
      { id: 'm3-httponly', type: 'choice', q: 'La cookie PHPSESSID **no** lleva HttpOnly. ¿Qué riesgo añade?', opts: ['Ninguno, solo es estética', 'Que un JavaScript inyectado (XSS) puede leerla y robar la sesión', 'Que la cookie caduca antes', 'Que no se envía por HTTP'], ans: 1, hints: ['HttpOnly decide quién puede leer la cookie desde el navegador.'], ok: 'Exacto: sin HttpOnly, `document.cookie` la expone a cualquier XSS.' },
      { id: 'm3-ftp', type: 'text', q: '¿Qué **contraseña** usa el usuario backup en FTP?', ans: ['Bkp-2026!'], exact: true, proof: 'ftp.request.command == "PASS" && ftp.request.arg == "Bkp-2026!"', hints: ['Filtra `ftp`.', 'Busca la orden PASS.'], ok: 'Bkp-2026! Y el servidor responde 230: entrada concedida.' },

      { h: 'Tipos de registro', p: ['**A**: nombre → IPv4. **AAAA**: nombre → IPv6. **CNAME**: alias de otro nombre (típico de CDNs). **MX**: servidores de correo. **TXT**: texto libre (SPF, verificaciones de dominio… y a veces secretos). **PTR**: IP → nombre.', 'En el árbol verás `dns.a`, `dns.cname` y `dns.txt` dentro de «Answers».'], try: [['dns.cname', 'Respuestas con alias'], ['dns.qry.type == 16', 'Preguntas TXT']] },
      { h: 'NXDOMAIN: lo que no existe también informa', p: ['Si el nombre no existe, el servidor responde con **rcode 3 (No such name)**. Un montón de NXDOMAIN seguidos desde una misma IP suele ser **enumeración de subdominios** (como hace un atacante buscando dev., staging., test.).', 'El filtro es `dns.flags.rcode == 3`.'], try: [['dns.flags.rcode == 3', 'Nombres que no existen']] },

      { h: 'SNI: el nombre viaja en claro', p: ['En el Client Hello va la extensión **SNI** (Server Name Indication) con el nombre del sitio, **sin cifrar**: `tls.handshake.extensions_server_name`. Por eso un cortafuegos o un analista sabe a qué webs vas aunque no vea el contenido.', '**ALPN** dice qué protocolo irá dentro: `http/1.1` o `h2` (HTTP/2).'], try: [['tls.handshake.extensions_server_name', 'Todos los SNI'], ['tls.handshake.extensions_alpn_str == "h2"', 'Quien pide HTTP/2']] },

/* Megalodon · estado y progreso guardados en localStorage («megalodon.v1»). */
const STORE_KEY = 'megalodon.v1';
const LEVELS = [[0, 'Alevín'], [80, 'Tintorera'], [200, 'Tiburón martillo'], [380, 'Gran blanco'], [600, 'Megalodón']];
const XP_BY_HINTS = [10, 8, 6, 5];
const BONUS_MODULE = 20;
const S = (() => {
  const base = () => ({ v: 1, done: {}, hints: {}, badges: {}, settings: { theme: 'system', lang: 'es', relative: true, colorize: true } });
  let st = base();
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) st = { ...base(), ...o, settings: { ...base().settings, ...(o.settings || {}) } }; } } catch { /* almacenamiento no disponible: se trabaja en memoria */ }
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch { /* sin persistencia */ } };
  const listeners = new Set();
  const emit = () => listeners.forEach(f => f());
  return {
    get: () => st,
    on: f => { listeners.add(f); return () => listeners.delete(f); },
    set(k, v) { st.settings[k] = v; save(); emit(); },
    hintsUsed: id => st.hints[id] || 0,
    useHint(id) { st.hints[id] = (st.hints[id] || 0) + 1; save(); },
    isDone: id => !!st.done[id],
    solve(id) {
      if (st.done[id]) return 0;
      const xp = XP_BY_HINTS[Math.min(XP_BY_HINTS.length - 1, st.hints[id] || 0)];
      st.done[id] = { xp, at: Date.now() }; save(); emit(); return xp;
    },
    earnBadge(mid) { if (st.badges[mid]) return false; st.badges[mid] = Date.now(); save(); emit(); return true; },
    xp() { return Object.values(st.done).reduce((s, d) => s + d.xp, 0) + Object.keys(st.badges).length * BONUS_MODULE; },
    level() { const x = this.xp(); let i = 0; LEVELS.forEach(([min], j) => { if (x >= min) i = j; }); return { i, name: LEVELS[i][1], next: LEVELS[i + 1] ? LEVELS[i + 1][0] : null, min: LEVELS[i][0] }; },
    reset() { const keep = st.settings; st = base(); st.settings = keep; save(); emit(); },
  };
})();
const modProgress = m => { const done = m.tasks.filter(x => S.isDone(x.id)).length; return { done, total: m.tasks.length, pct: Math.round(100 * done / m.tasks.length) }; };

/* Megalodon · utilidades de interfaz: escape, formato ligero, diálogos, avisos y portapapeles. */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
/* `código` y **negrita** sobre texto ya escapado */
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
let uid = 0; const nextId = p => `${p}-${++uid}`;
const fmtNum = n => n.toLocaleString(LANG === 'en' ? 'en-GB' : 'es-ES');
const fmtBytes = n => n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1).replace('.', LANG === 'en' ? '.' : ',')} KB`;

function toast(msg, kind = 'info', icon) {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `${ic(icon || (kind === 'ok' ? 'ok' : kind === 'err' ? 'ko' : 'info'))}<span>${msg}</span>`;
  box.append(el);
  const live = [...box.children].filter(x => !x.classList.contains('out'));
  live.slice(0, Math.max(0, live.length - 3)).forEach(x => { x.classList.remove('in'); x.classList.add('out'); setTimeout(() => x.remove(), 220); });
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); setTimeout(() => el.remove(), 220); }, kind === 'err' ? 5200 : 2600);
}

/* Un único <dialog> reutilizable. openDialog devuelve el elemento del cuerpo; onClose se llama al cerrar. */
let dlgClose = null, dlgReturn = null;
function openDialog({ title, body, wide = false, cls = '', onClose, role, footer }) {
  const d = $('#dlg');
  if (d.open) closeDialog(true);
  dlgReturn = document.activeElement;
  const tid = nextId('dlg-t');
  d.className = `dlg ${wide ? 'wide' : ''} ${cls}`;
  d.setAttribute('aria-labelledby', tid);
  if (role) d.setAttribute('role', role); else d.removeAttribute('role');
  d.innerHTML = `<div class="dlg-in"><div class="dlg-h"><h2 id="${tid}">${title}</h2><button class="ibtn" data-x aria-label="${t('close')}">${ic('x')}</button></div><div class="dlg-b"></div>${footer ? `<div class="dlg-f">${footer}</div>` : ''}</div>`;
  const b = $('.dlg-b', d);
  if (typeof body === 'string') b.innerHTML = body; else if (body) b.append(body);
  $('[data-x]', d).onclick = () => closeDialog();
  dlgClose = onClose || null;
  d.showModal();
  d.classList.remove('closing');
  return d;
}
function closeDialog(instant) {
  const d = $('#dlg'); if (!d.open) return;
  const done = () => { d.close(); d.classList.remove('closing'); const f = dlgClose; dlgClose = null; if (f) f(); if (dlgReturn && dlgReturn.isConnected) dlgReturn.focus(); };
  if (instant || REDUCED.matches) return done();
  d.classList.add('closing'); setTimeout(done, 150);
}
document.addEventListener('DOMContentLoaded', () => {
  const d = $('#dlg');
  d.addEventListener('cancel', e => { e.preventDefault(); closeDialog(); });
  d.addEventListener('click', e => { if (e.target === d) closeDialog(); });
});

function confirmDialog({ title, text, ok, danger = true }) {
  return new Promise(res => {
    let answered = false;
    const d = openDialog({ title, role: 'alertdialog', cls: 'narrow', body: `<p class="lead-sm">${text}</p>`, footer: `<button class="btn ghost" data-no>${t('cancel')}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${ok}</button>`, onClose: () => { if (!answered) res(false); } });
    $('[data-no]', d).onclick = () => { answered = true; res(false); closeDialog(); };
    $('[data-yes]', d).onclick = () => { answered = true; res(true); closeDialog(); };
    $('[data-no]', d).focus();
  });
}

async function copyText(txt, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch {
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.className = 'vh'; document.body.append(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch { ok = false; } ta.remove();
  }
  if (btn) { btn.classList.add('done'); btn.innerHTML = ic(ok ? 'copied' : 'ko'); btn.setAttribute('aria-label', ok ? t('copied') : 'Error'); setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = ic('copy'); btn.setAttribute('aria-label', t('copy')); }, 1400); }
  toast(ok ? `${t('copied')}: <code>${esc(txt)}</code>` : 'No se pudo copiar', ok ? 'ok' : 'err', ok ? 'copied' : 'ko');
}

function download(bytes, name, type = 'application/octet-stream') {
  const url = URL.createObjectURL(new Blob([bytes], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const ROW_H = 28, PHEAD_H = 30;
const COLOR_NAMES = { bad: 'Bad TCP', rst: 'TCP RST', arp: 'ARP', icmp: 'ICMP', smb: 'SMB / Kerberos', http: 'HTTP', synfin: 'TCP SYN/FIN', tcp: 'TCP', udp: 'UDP' };

function filterFor(node) {
  if (!node || !node.field) return '';

  if (def.t === 'p') return node.field;
  const v = node.v;
  if (v === undefined || v === true) return node.field;
  if (def.t === 's') return `${node.field} == "${String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"`;
  if (node.field === 'tcp.flags') return `tcp.flags == 0x${Number(v).toString(16).padStart(3, '0')}`;

  renderTree(p) {
    this.$.treeEmpty.hidden = true;

    let k = 0;
    const walk = (nodes, depth, parentId) => nodes.map(n => {
      const id = `${this.id}-n${k++}`, key = treeKey(n, depth), kids = n.kids.length > 0, open = kids && this.expanded.has(key);

        ${kids ? `<ul role="group"${open ? '' : ' hidden'}>${walk(n.kids, depth + 1, id)}</ul>` : ''}</li>`;

  onTreeClick(e) {

    this.selectNode(f.node, true);
  }
  onTreeKey(e) {
    const vis = this.visibleFlat(); if (!vis.length) return;
    let i = vis.findIndex(f => f.node === this.selNode);
    const cur = vis[i];
    const go = j => { e.preventDefault(); const f = vis[Math.max(0, Math.min(vis.length - 1, j))]; this.selectNode(f.node, true); };
    if (e.key === 'ArrowDown') go(i + 1); else if (e.key === 'ArrowUp') go(i < 0 ? 0 : i - 1);
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(vis.length - 1);
    else if (e.key === 'ArrowRight' && cur) { e.preventDefault(); if (cur.kids && !cur.open) this.toggle(cur, true); else if (cur.kids) go(i + 1); }
    else if (e.key === 'ArrowLeft' && cur) { e.preventDefault(); if (cur.kids && cur.open) this.toggle(cur, false); else if (cur.parentId) this.selectNode(this.flat.find(x => x.id === cur.parentId).node, true); else this.$.list.focus(); }
    else if (e.key === 'Enter' && cur) { e.preventDefault(); const f = filterFor(cur.node); if (f) { this.setFilter(f); toast(`${t('applyAsFilter')}: <code>${esc(f)}</code>`, 'info', 'filter'); } else this.toggle(cur); }
    else if (e.key === ' ' && cur) { e.preventDefault(); this.toggle(cur); }
  }
  renderHex(p) {
    const b = p.b, lines = [];
    for (let o = 0; o < b.length; o += 16) {
      let hx = '', as = '';
      for (let i = o; i < o + 16; i++) {
        if (i < b.length) { const v = b[i]; hx += `<span data-o="${i}">${v.toString(16).padStart(2, '0')}</span>`; as += `<span data-o="${i}">${v >= 32 && v < 127 ? esc(String.fromCharCode(v)) : '·'}</span>`; }
        else { hx += '<span class="pad">  </span>'; }
        if (i === o + 7) hx += '<span class="gap"> </span>';
      }
      lines.push(`<div class="hl-row"><span class="off">${o.toString(16).padStart(4, '0')}</span><span class="hx">${hx}</span><span class="as">${as}</span></div>`);
    }
    this.$.hex.innerHTML = lines.join('');
    this.byteEls = new Map(); $$('[data-o]', this.$.hex).forEach(el => { const o = +el.dataset.o; (this.byteEls.get(o) || this.byteEls.set(o, []).get(o)).push(el); });
  }
  highlight(node) {
    $$('.on, .on2', this.$.hex).forEach(el => el.classList.remove('on', 'on2'));
    if (!node) return;
    const top = this.flat.find(x => x.node === node); let root = top; while (root && root.parentId) root = this.flat.find(x => x.id === root.parentId);
    if (root && root.node !== node) for (let o = root.node.s; o < root.node.s + root.node.n; o++) (this.byteEls.get(o) || []).forEach(el => el.classList.add('on2'));
    for (let o = node.s; o < node.s + node.n; o++) (this.byteEls.get(o) || []).forEach(el => el.classList.add('on'));
    const first = (this.byteEls.get(node.s) || [])[0]; if (first && node.n) first.scrollIntoView({ block: 'nearest' });
  }
  selectByte(o) {
    let best = null;
    for (const f of this.flat) if (f.node.n > 0 && o >= f.node.s && o < f.node.s + f.node.n && (!best || f.depth > best.depth || (f.depth === best.depth && f.node.n < best.node.n))) best = f;
    if (best) this.selectNode(best.node);
  }

  follow(stream) {
    const p = this.selected();
    const st = stream ?? (p && p.tcpStream);
    if (st === undefined || st === null) { toast('Selecciona un paquete TCP para seguir su flujo.', 'info', 'follow'); return; }
    openFollow(this, st);
  }
  destroy() { this.unsub && this.unsub(); this.host.innerHTML = ''; }
}

function ladderSVG(pkts, stream, onPick) {

  const names = { hs: 'Saludo', data: 'Datos', fin: 'Cierre' };
  const groups = [];
  L.steps.forEach((s, i) => { const ph = phase(s); if (!groups.length || groups[groups.length - 1].ph !== ph) groups.push({ ph, a: i, b: i }); else groups[groups.length - 1].b = i; });
  const wrap = document.createElement('figure');
  wrap.className = 'ladder';
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Diagrama del flujo TCP ${stream}: ${L.steps.length} paquetes entre ${L.a}:${L.pa} y ${L.b}:${L.pb}">
    <text class="lh" x="${ax}" y="20" text-anchor="middle">Kali</text><text class="lh2" x="${ax}" y="38" text-anchor="middle">${L.a}:${L.pa}</text>

    ${groups.map(g => `<g class="ph ph-${g.ph}"><rect x="8" y="${top + g.a * rh - 12}" width="74" height="${(g.b - g.a + 1) * rh - 8}" rx="8"/><text x="45" y="${top + ((g.a + g.b) / 2) * rh + 8}" text-anchor="middle">${names[g.ph]}</text></g>`).join('')}
    ${L.steps.map((s, i) => {
      const y = top + i * rh, x1 = s.fromA ? ax : bx, x2 = s.fromA ? bx : ax, dir = s.fromA ? 1 : -1, mid = (ax + bx) / 2;
      const lab = s.flags.join(', ') + (s.app ? ` · ${s.app}` : '');
      return `<g class="step ${s.flags.includes('RST') ? 'rst' : ''} ${s.app ? 'app' : ''}" data-no="${s.no}" data-i="${i}" tabindex="0" role="button" aria-label="Paquete ${s.no}: ${esc(lab)}, Seq ${s.seq}, Ack ${s.ack}, Len ${s.len}">
        <line class="ar" x1="${x1}" y1="${y}" x2="${x2 - dir * 7}" y2="${y + 12}" pathLength="1"/>
        <path class="hd" d="M ${x2} ${y + 12.3} l ${-dir * 10} -7 l 0 9 z"/>
        <text class="sl" x="${mid}" y="${y - 3}" text-anchor="middle">${esc(lab)}</text>
        <text class="sn" x="${mid}" y="${y + 26}" text-anchor="middle">#${s.no} · Seq=${s.seq}${s.flags.includes('ACK') ? ` Ack=${s.ack}` : ''} Len=${s.len}</text>
      </g>`;

  </svg>
  <figcaption class="row between"><span class="sm muted">Pulsa una flecha para abrir ese paquete en Wireshark.</span><button class="btn sm ghost" type="button" data-replay>${ic('reset', 'sm')}Repetir animación</button></figcaption>`;
  const steps = $$('.step', wrap);
  steps.forEach((g, i) => { g.style.setProperty('--d', `${i * 110}ms`); });
  const play = () => { if (REDUCED.matches) return; wrap.classList.remove('play'); void wrap.offsetWidth; wrap.classList.add('play'); };
  const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { play(); io.disconnect(); } }, { threshold: 0.35 });
  io.observe(wrap);
  $('[data-replay]', wrap).onclick = play;
  const pick = g => { steps.forEach(x => x.classList.toggle('on', x === g)); onPick && onPick(+g.dataset.no); };
  steps.forEach(g => { g.addEventListener('click', () => pick(g)); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(g); } }); });
  return wrap;
}

/* ======================= Boca, según la anatomía documentada =======================
   - Abierta, cada mandíbula es un arco en herradura cubierto por una banda gruesa de encía.
   - La mandíbula superior (palatocuadrado) no está soldada al cráneo: al morder protruye hacia delante

/* Diente: corona triangular con bordes convexos y aserrados, raíz hundida en la encía. */

    const zig = (k % 2 && k < K) ? .02 * b * (1 - t * .6) : 0;                            // aserrado fino
