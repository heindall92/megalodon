/* Un único <dialog> reutilizable. openDialog devuelve el elemento del cuerpo; onClose se llama al cerrar. */
let dlgClose = null, dlgReturn = null;
let dlgTimer = 0;                                            // cierre animado pendiente: no debe cerrar un diálogo abierto después
function openDialog({ title, body, wide = false, cls = '', onClose, role, footer }) {
  const d = $('#dlg');
  if (dlgTimer) { clearTimeout(dlgTimer); dlgTimer = 0; }
  if (d.open) closeDialog(true);
  dlgReturn = document.activeElement;
  const tid = nextId('dlg-t');
  d.className = `dlg ${wide ? 'wide' : ''} ${cls}`;
  d.setAttribute('aria-labelledby', tid);
  if (role) d.setAttribute('role', role); else d.removeAttribute('role');
  d.innerHTML = `<div class="dlg-in"><div class="dlg-h"><h2 id="${tid}">${title}</h2><button class="ibtn" data-x aria-label="${t('close')}">${ic('x')}</button></div><div class="dlg-b"></div>${footer ? `<div class="dlg-f">${footer}</div>` : ''}</div>`;
  const b = $('.dlg-b', d);
  if (typeof body === 'string') b.innerHTML = body; else if (body) b.append(body);
  $('[data-x]', d).onclick = () => closeDialog();
  dlgClose = onClose || null;
  d.showModal();
  d.classList.remove('closing');
  return d;
}
function closeDialog(instant) {
  const d = $('#dlg'); if (!d.open) return;
  if (dlgTimer) { clearTimeout(dlgTimer); dlgTimer = 0; }
  const done = () => { dlgTimer = 0; d.close(); d.classList.remove('closing'); const f = dlgClose; dlgClose = null; if (f) f(); if (dlgReturn && dlgReturn.isConnected) dlgReturn.focus(); };
  if (instant || REDUCED.matches) return done();
  d.classList.add('closing'); dlgTimer = setTimeout(done, 150);
}
document.addEventListener('DOMContentLoaded', () => {
  const d = $('#dlg');
  d.addEventListener('cancel', e => { e.preventDefault(); closeDialog(); });
  d.addEventListener('click', e => { if (e.target === d) closeDialog(); });
});

function confirmDialog({ title, text, ok, danger = true }) {
  return new Promise(res => {
    let answered = false;
    const d = openDialog({ title, role: 'alertdialog', cls: 'narrow', body: `<p class="lead-sm">${text}</p>`, footer: `<button class="btn ghost" data-no>${t('cancel')}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${ok}</button>`, onClose: () => { if (!answered) res(false); } });
    $('[data-no]', d).onclick = () => { answered = true; res(false); closeDialog(); };
    $('[data-yes]', d).onclick = () => { answered = true; res(true); closeDialog(); };

  });
}

async function copyText(txt, btn) {

    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.className = 'vh'; document.body.append(ta); ta.select();

        if (i < b.length) { const v = b[i]; hx += `<span data-o="${i}">${v.toString(16).padStart(2, '0')}</span>`; as += `<span data-o="${i}">${v >= 32 && v < 127 ? esc(String.fromCharCode(v)) : '·'}</span>`; }
        else { hx += '<span class="pad">  </span>'; }
        if (i === o + 7) hx += '<span class="gap"> </span>';
      }
      lines.push(`<div class="hl-row"><span class="off">${o.toString(16).padStart(4, '0')}</span><span class="hx">${hx}</span><span class="as">${as}</span></div>`);
    }
    this.$.hex.innerHTML = lines.join('');
    this.byteEls = new Map(); $$('[data-o]', this.$.hex).forEach(el => { const o = +el.dataset.o; (this.byteEls.get(o) || this.byteEls.set(o, []).get(o)).push(el); });
  }
  highlight(node) {
    $$('.on, .on2', this.$.hex).forEach(el => el.classList.remove('on', 'on2'));
    if (!node) return;
    const top = this.flat.find(x => x.node === node); let root = top; while (root && root.parentId) root = this.flat.find(x => x.id === root.parentId);
    if (root && root.node !== node) for (let o = root.node.s; o < root.node.s + root.node.n; o++) (this.byteEls.get(o) || []).forEach(el => el.classList.add('on2'));
    for (let o = node.s; o < node.s + node.n; o++) (this.byteEls.get(o) || []).forEach(el => el.classList.add('on'));
    const first = (this.byteEls.get(node.s) || [])[0]; if (first && node.n) first.scrollIntoView({ block: 'nearest' });
  }
  selectByte(o) {
    let best = null;
    for (const f of this.flat) if (f.node.n > 0 && o >= f.node.s && o < f.node.s + f.node.n && (!best || f.depth > best.depth || (f.depth === best.depth && f.node.n < best.node.n))) best = f;
    if (best) this.selectNode(best.node);
  }

  follow(stream) {
    const p = this.selected();
    if (stream === undefined && p && p.tcpStream === undefined && p.f['udp.stream']) return openFollow(this, p.f['udp.stream'][0], 'udp');
    const st = stream ?? (p && p.tcpStream);
    if (st === undefined || st === null) { toast(L('Selecciona un paquete TCP o UDP para seguir su flujo.', 'Select a TCP or UDP packet to follow its stream.'), 'info', 'follow'); return; }
    openFollow(this, st);
  }
  destroy() { this.unsub && this.unsub(); this.host.innerHTML = ''; }
}

/* src/app/40-dialogs.js */
/* Megalodon · diálogos del espacio de trabajo: Seguir flujo (TCP y UDP), Estadísticas (conversaciones, endpoints, jerarquía, E/S),
   Información experta, Exportar objetos HTTP, Credenciales, Buscar e Ir al paquete. */
function openFollow(ws, stream, kind = 'tcp') {
  const udp = kind === 'udp', sid = p => udp ? (p.f['udp.stream'] ? p.f['udp.stream'][0] : undefined) : p.tcpStream;
  const streams = [...new Set(ws.pkts.map(sid).filter(x => x !== undefined))].sort((a, b) => a - b);
  let cur = stream;
  const body = document.createElement('div');
  const render = () => {
    const fs = udp ? followUdp(ws.pkts, cur) : followTcp(ws.pkts, cur);
    const idx = streams.indexOf(cur);
    body.innerHTML = `<div class="fs-head">
        <div class="fs-ends"><span class="who cli">${ic('arrowR', 'sm')}${t('client')} <code>${esc(fs.client)}</code></span><span class="who srv">${ic('arrowL', 'sm')}${t('server')} <code>${esc(fs.server)}</code></span></div>
        <div class="row"><button class="ibtn" data-prev ${idx <= 0 ? 'disabled' : ''} aria-label="${t('prevStream')}">${ic('chevL')}</button><span class="mono sm">${kind}.stream eq ${cur}</span><button class="ibtn" data-next ${idx >= streams.length - 1 ? 'disabled' : ''} aria-label="${t('nextStream')}">${ic('chevR')}</button></div>
      </div>
      <div class="fs-body mono" tabindex="0" aria-label="${L('Contenido del flujo', 'Stream content')}">${fs.chunks.length ? fs.chunks.map(c => `<pre class="${c.client ? 'cli' : 'srv'}"><span class="vh">${c.client ? t('client') : t('server')}: </span>${esc(c.text)}</pre>`).join('') : `<p class="muted">${udp ? L('Este flujo UDP no lleva datos.', 'This UDP stream carries no data.') : L('Este flujo no lleva datos: solo saludo y cierre (o un RST).', 'This stream carries no data: just handshake and teardown (or an RST).')}</p>`}</div>
      <p class="sm muted fs-sum">${t('client')} → ${t('server')}: <strong>${fmtNum(fs.cBytes)}</strong> bytes · ${t('server')} → ${t('client')}: <strong>${fmtNum(fs.sBytes)}</strong> bytes · ${fs.chunks.length} ${L('bloques', 'chunks')}</p>`;
    $('[data-prev]', body).onclick = () => { cur = streams[idx - 1]; render(); };
    $('[data-next]', body).onclick = () => { cur = streams[idx + 1]; render(); };
  };
  render();
  const d = openDialog({ title: `${ic('follow')} ${udp ? t('followUdp') : t('follow')}`, body, wide: true, footer: `<button class="btn ghost" data-close>${t('close')}</button><button class="btn primary" data-filt>${ic('filter')}${t('filterStream')}</button>` });
  $('[data-close]', d).onclick = () => closeDialog();
  $('[data-filt]', d).onclick = () => { ws.setFilter(`${kind}.stream eq ${cur}`); closeDialog(); };
}

function openStats(ws, tab = 'conv') {
  const body = document.createElement('div');
  const tabs = [['conv', t('conv'), 'swap'], ['ends', t('endpoints'), 'network'], ['hier', t('hier'), 'layers'], ['io', t('io'), 'activity']];
  body.innerHTML = `<div class="seg" role="tablist" aria-label="${t('stats')}">${tabs.map(([k, l, i]) => `<button role="tab" id="st-${k}" aria-controls="st-p" aria-selected="${k === tab}" tabindex="${k === tab ? 0 : -1}" data-tab="${k}">${ic(i, 'sm')}${l}</button>`).join('')}</div><div id="st-p" role="tabpanel" class="st-p" tabindex="0"></div>`;
  const panel = $('#st-p', body);
  const show = k => {
    tab = k;
    $$('[role=tab]', body).forEach(b => { const on = b.dataset.tab === k; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    panel.setAttribute('aria-labelledby', `st-${k}`);
    if (k === 'conv') convPanel(ws, panel); else if (k === 'ends') endsPanel(ws, panel); else if (k === 'hier') hierPanel(ws, panel); else ioPanel(ws, panel);
  };
  $('.seg', body).addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) show(b.dataset.tab); });
  $('.seg', body).addEventListener('keydown', e => {
    if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
    const i = tabs.findIndex(x => x[0] === tab), j = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    show(tabs[j][0]); $(`#st-${tabs[j][0]}`, body).focus();
  });
  openDialog({ title: `${ic('stats')} ${t('stats')}`, body, wide: true });
  show(tab);
}

function convPanel(ws, panel) {

    const rows = c[k], ports = k === 'tcp' || k === 'udp';
    const fl = r => k === 'tcp' ? `tcp.stream eq ${r.stream}` : k === 'udp' ? `udp.stream eq ${r.stream}` : k === 'ip' ? `ip.addr == ${r.a} && ip.addr == ${r.b}` : `eth.addr == ${r.a} && eth.addr == ${r.b}`;

      <div class="tbl-wrap" tabindex="0" role="region" aria-label="${t('stats')}"><table class="tbl"><caption class="vh">${t('conv')} ${k}</caption><thead><tr><th scope="col">${k === 'eth' ? L('Dirección A', 'Address A') : 'IP A'}</th>${ports ? `<th scope="col" class="n">${L('Puerto A', 'Port A')}</th>` : ''}<th scope="col">${k === 'eth' ? L('Dirección B', 'Address B') : 'IP B'}</th>${ports ? `<th scope="col" class="n">${L('Puerto B', 'Port B')}</th>` : ''}<th scope="col" class="n">${L('Paquetes', 'Packets')}</th><th scope="col" class="n">Bytes</th><th scope="col" class="n">A → B</th><th scope="col" class="n">B → A</th><th scope="col" class="n">${L('Inicio', 'Start')}</th><th scope="col" class="n">${L('Duración', 'Duration')}</th><th scope="col"><span class="vh">${L('Acción', 'Action')}</span></th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td class="mono">${esc(r.a)}</td>${ports ? `<td class="n mono">${r.pa}</td>` : ''}<td class="mono">${esc(r.b)}</td>${ports ? `<td class="n mono">${r.pb}</td>` : ''}<td class="n">${r.pkts}</td><td class="n">${fmtNum(r.bytes)}</td><td class="n">${r.ab}</td><td class="n">${r.ba}</td><td class="n mono">${r.start.toFixed(3)}</td><td class="n mono">${r.dur.toFixed(3)}</td><td><button class="ibtn sm" data-f="${esc(fl(r))}" aria-label="${t('filterThis')}: ${esc(fl(r))}" title="${t('filterThis')}">${ic('filter', 'sm')}</button></td></tr>`).join('')}</tbody></table></div>

    $$('[data-k]', panel).forEach(b => b.onclick = () => { k = b.dataset.k; draw(); });
    $$('[data-f]', panel).forEach(b => b.onclick = () => { ws.setFilter(b.dataset.f); closeDialog(); });
  };
  draw();
}

function hierPanel(ws, panel) {

function ioPanel(ws, panel) {
  const last = ws.pkts.length ? ws.pkts[ws.pkts.length - 1].rel : 0;
  const opts = [0.01, 0.1, 1, 10, 60].filter(x => last / x <= 400 && last / x >= 3);
  let iv = opts.includes(1) ? 1 : opts[0] || 1;
  const draw = () => {
    const test = ws.parsed && ws.parsed.ok && !ws.parsed.empty ? ws.parsed.test : null;
    const g = ioGraph(ws.pkts, iv, test), max = Math.max(1, ...g.buckets.map(b => b.all));
    const W = 720, H = 240, pl = 36, pb = 26, bw = (W - pl - 8) / g.buckets.length;
    const y = v => H - pb - (v / max) * (H - pb - 10);
    const ticks = [0, Math.ceil(max / 2), max];
    const xl = Math.max(1, Math.ceil(g.buckets.length / 8));
    panel.innerHTML = `<div class="row between"><div class="row sm"><span class="lgd all"><i></i>${t('allPackets')}</span>${test ? `<span class="lgd hit"><i></i>${t('matching')}: <code>${esc(ws.filterText)}</code></span>` : `<span class="muted">${L('Aplica un filtro para compararlo con el total.', 'Apply a filter to compare it with the total.')}</span>`}</div>
      <label class="row sm">${t('interval')} <select data-iv>${(opts.length ? opts : [iv]).map(o => `<option value="${o}" ${o === iv ? 'selected' : ''}>${o} s</option>`).join('')}</select></label></div>
      <svg class="io" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L(`Paquetes por intervalo de ${iv} segundos: máximo ${max}`, `Packets per ${iv}-second interval: maximum ${max}`)}">
        ${ticks.map(v => `<line class="gl" x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
        ${g.buckets.map((b, i) => `<rect class="b-all" x="${pl + i * bw + bw * 0.12}" y="${y(b.all)}" width="${Math.max(1, bw * 0.76)}" height="${H - pb - y(b.all)}" rx="${Math.min(3, bw / 4)}"><title>${b.t} s: ${b.all} ${L('paquetes', 'packets')}${test ? `, ${b.hit} ${L('cumplen el filtro', 'match the filter')}` : ''}</title></rect>${test && b.hit ? `<rect class="b-hit" x="${pl + i * bw + bw * 0.12}" y="${y(b.hit)}" width="${Math.max(1, bw * 0.76)}" height="${H - pb - y(b.hit)}" rx="${Math.min(3, bw / 4)}"/>` : ''}`).join('')}
        ${g.buckets.map((b, i) => i % xl === 0 ? `<text class="ax" x="${pl + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${+b.t.toFixed(2)}</text>` : '').join('')}
      </svg><p class="sm muted">${L('Eje horizontal: segundos desde el primer paquete. Un pico que se repite a intervalos fijos puede ser un beacon.', 'Horizontal axis: seconds since the first packet. A spike that repeats at fixed intervals may be a beacon.')}</p>`;
    $('[data-iv]', panel).onchange = e => { iv = +e.target.value; draw(); };
  };
  draw();
}

    if (!ws.view.some(p => p.no === n)) { m2.className = 'sm bad'; m2.textContent = L(`El paquete ${n} está oculto por el filtro actual. Bórralo para verlo.`, `Packet ${n} is hidden by the current filter. Clear it to see it.`); return; }
    closeDialog(); ws.select(n, { focusList: true });

}
/* Busca el siguiente paquete mostrado, tras el seleccionado y dando la vuelta, como Wireshark. */
function findPacket(ws, kind, q, cs) {
  q = String(q || '');
  if (!q.trim()) return { ok: false, msg: L('Escribe qué buscar.', 'Type what to find.') };
  let test;
  if (kind === 'filter') { const r = parseFilter(q); if (!r.ok) return { ok: false, msg: fErr(r.error) || L('El filtro no es válido.', 'The filter is not valid.') }; test = r.test; }
  else if (kind === 'hex') {
    const h = q.replace(/0x|[\s:.-]/gi, '');
    if (!/^([0-9a-f]{2})+$/i.test(h)) return { ok: false, msg: L('Escribe bytes en hexadecimal, por pares: 50 4b 03 04', 'Type bytes in hex, in pairs: 50 4b 03 04') };
    const nd = h.match(/../g).map(x => parseInt(x, 16));
    test = p => { const b = p.b; outer: for (let i = 0; i + nd.length <= b.length; i++) { for (let j = 0; j < nd.length; j++) if (b[i + j] !== nd[j]) continue outer; return true; } return false; };
  } else {
    const needle = cs ? q : q.toLowerCase();
    test = p => { const s = TD.decode(p.b); return (cs ? s : s.toLowerCase()).includes(needle); };
  }
  const v = ws.view, start = Math.max(-1, v.findIndex(p => p.no === ws.sel));
  for (let k = 1; k <= v.length; k++) {
    const p = v[(start + k) % v.length];
    if (test(p)) { ws.select(p.no); return { ok: true, msg: `${L('Encontrado en el paquete', 'Found in packet')} ${p.no}${(start + k) >= v.length && start >= 0 ? L(' (se ha dado la vuelta)', ' (wrapped around)') : ''}.` }; }
  }
  return { ok: false, msg: L('No aparece en ningún paquete mostrado.', 'Not found in any displayed packet.') };
}

/* Megalodon · diagrama de escalera animado de un flujo TCP (módulo 1). Cada flecha es un paquete; al pulsarla se selecciona en Wireshark. */
function ladderSVG(pkts, stream, onPick) {
  const LD = flowLadder(pkts, stream); if (!LD) return document.createElement('div');
  const W = 560, ax = 150, bx = 470, top = 64, rh = 40, H = top + LD.steps.length * rh + 16;
  const phase = s => s.flags.includes('SYN') ? 'hs' : s.flags.includes('FIN') || s.flags.includes('RST') || (s.len === 0 && LD.steps.some(x => x.flags.includes('FIN') && x.no < s.no)) ? 'fin' : 'data';
  const names = LANG === 'en' ? { hs: 'Handshake', data: 'Data', fin: 'Teardown' } : { hs: 'Saludo', data: 'Datos', fin: 'Cierre' };
  const groups = [];
  LD.steps.forEach((s, i) => { const ph = phase(s); if (!groups.length || groups[groups.length - 1].ph !== ph) groups.push({ ph, a: i, b: i }); else groups[groups.length - 1].b = i; });
  const wrap = document.createElement('figure');
  wrap.className = 'ladder';
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${L(`Diagrama del flujo TCP ${stream}: ${LD.steps.length} paquetes entre ${LD.a}:${LD.pa} y ${LD.b}:${LD.pb}`, `TCP stream ${stream} diagram: ${LD.steps.length} packets between ${LD.a}:${LD.pa} and ${LD.b}:${LD.pb}`)}">
    <text class="lh" x="${ax}" y="20" text-anchor="middle">Kali</text><text class="lh2" x="${ax}" y="38" text-anchor="middle">${LD.a}:${LD.pa}</text>
    <text class="lh" x="${bx}" y="20" text-anchor="middle">${L('Servidor web', 'Web server')}</text><text class="lh2" x="${bx}" y="38" text-anchor="middle">${LD.b}:${LD.pb}</text>
    <line class="life" x1="${ax}" x2="${ax}" y1="48" y2="${H - 6}"/><line class="life" x1="${bx}" x2="${bx}" y1="48" y2="${H - 6}"/>
    ${groups.map(g => `<g class="ph ph-${g.ph}"><rect x="8" y="${top + g.a * rh - 12}" width="74" height="${(g.b - g.a + 1) * rh - 8}" rx="8"/><text x="45" y="${top + ((g.a + g.b) / 2) * rh + 8}" text-anchor="middle">${names[g.ph]}</text></g>`).join('')}
    ${LD.steps.map((s, i) => {
      const y = top + i * rh, x1 = s.fromA ? ax : bx, x2 = s.fromA ? bx : ax, dir = s.fromA ? 1 : -1, mid = (ax + bx) / 2;
      const lab = s.flags.join(', ') + (s.app ? ` · ${s.app}` : '');
      return `<g class="step ${s.flags.includes('RST') ? 'rst' : ''} ${s.app ? 'app' : ''}" data-no="${s.no}" data-i="${i}" tabindex="0" role="button" aria-label="${L('Paquete', 'Packet')} ${s.no}: ${esc(lab)}, Seq ${s.seq}, Ack ${s.ack}, Len ${s.len}">
        <line class="ar" x1="${x1}" y1="${y}" x2="${x2 - dir * 7}" y2="${y + 12}" pathLength="1"/>
        <path class="hd" d="M ${x2} ${y + 12.3} l ${-dir * 10} -7 l 0 9 z"/>
        <text class="sl" x="${mid}" y="${y - 3}" text-anchor="middle">${esc(lab)}</text>
        <text class="sn" x="${mid}" y="${y + 26}" text-anchor="middle">#${s.no} · Seq=${s.seq}${s.flags.includes('ACK') ? ` Ack=${s.ack}` : ''} Len=${s.len}</text>
      </g>`;
    }).join('')}
  </svg>
  <figcaption class="row between"><span class="sm muted">${L('Pulsa una flecha para abrir ese paquete en Wireshark.', 'Click an arrow to open that packet in Wireshark.')}</span><button class="btn sm ghost" type="button" data-replay>${ic('reset', 'sm')}${L('Repetir animación', 'Replay animation')}</button></figcaption>`;
  const steps = $$('.step', wrap);
  steps.forEach((g, i) => { g.style.setProperty('--d', `${i * 110}ms`); });
  const play = () => { if (REDUCED.matches) return; wrap.classList.remove('play'); void wrap.offsetWidth; wrap.classList.add('play'); };
  const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { play(); io.disconnect(); } }, { threshold: 0.35 });
  io.observe(wrap);
  $('[data-replay]', wrap).onclick = play;
  const pick = g => { steps.forEach(x => x.classList.toggle('on', x === g)); onPick && onPick(+g.dataset.no); };
  steps.forEach(g => { g.addEventListener('click', () => pick(g)); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(g); } }); });
  return wrap;
}

  /* retos */
  refreshFilterPreview = () => $$('[data-curf]', main).forEach(el => { el.innerHTML = ws.filterText ? `<code>${esc(ws.filterText)}</code> · ${ws.view.length} ${L('paquetes', 'packets')}` : `<span class="muted">${t('none')}</span>`; });

  refreshFilterPreview(); refreshSelPreview();
  const fb = (card, kind, html) => { const el = $('.task-fb', card); el.className = `task-fb ${kind}`; el.innerHTML = html; if (kind === 'bad') { card.classList.remove('nope'); void card.offsetWidth; card.classList.add('nope'); } };

      hintBtn.hidden = n >= task.hints.length || S.isDone(task.id);
      hintBtn.querySelector('span').textContent = `${t('hint')} ${n + 1}/${task.hints.length}`;

      const mine = new Set(ws.view.map(p => p.no)), ref = new Set(applyFilter(ws.pkts, task.ref).map(p => p.no));
      const allow = task.mode === 'covers' ? new Set(applyFilter(ws.pkts, task.allow).map(p => p.no)) : ref;
      const missing = [...ref].filter(n => !mine.has(n)), extra = [...mine].filter(n => !allow.has(n));
      if (!missing.length && !extra.length) return succeed(task, card);
      const parts = [L(`Tu filtro muestra <strong>${mine.size}</strong> paquetes${task.mode === 'covers' ? '' : `; la solución, <strong>${ref.size}</strong>`}.`, `Your filter shows <strong>${mine.size}</strong> packets${task.mode === 'covers' ? '' : `; the solution, <strong>${ref.size}</strong>`}.`)];
      if (missing.length) parts.push(L(`Te faltan ${missing.length}.`, `${missing.length} missing.`));
      if (extra.length) parts.push(L(`Te sobran ${extra.length} (por ejemplo, el n.º ${extra[0]}).`, `${extra.length} too many (for example, No. ${extra[0]}).`));
      fb(card, 'bad', `${ic('ko')}<span>${parts.join(' ')}</span>`);
    };

      const p = ws.selected();

      const r = parseFilter(task.match);
      if (r.test(p)) succeed(task, card); else fb(card, 'bad', `${ic('ko')}<span>${L(`El n.º ${p.no} no es el que buscamos. Fíjate en la columna Info.`, `No. ${p.no} is not the one we are after. Look at the Info column.`)}</span>`);
    };
    if (task.type === 'text') {
      const inp = $('input', card);

        const v = inp.value.trim();
        if (!v) return fb(card, 'bad', `${ic('info')}<span>${L('Escribe tu respuesta.', 'Type your answer.')}</span>`);
        const ok = task.ans.some(a => task.list ? v.split(/[\s,;]+/).filter(Boolean).map(Number).sort((x, y) => x - y).join(',') === a : task.exact ? v === a : norm(v) === norm(a));
        if (ok) succeed(task, card); else fb(card, 'bad', `${ic('ko')}<span>${task.exact && task.ans.some(a => norm(a) === norm(v)) ? L('Casi: revisa mayúsculas y símbolos, las contraseñas se copian exactas.', 'Almost: check case and symbols, passwords are copied exactly.') : L('No es eso. Vuelve a mirar la captura o pide una pista.', 'Not quite. Look at the capture again or ask for a hint.')}</span>`);
      };
      $('[data-check]', card).onclick = check;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
    }
    if (task.type === 'choice') $$('[data-opt]', card).forEach(b => b.onclick = () => {
      if (+b.dataset.opt === task.ans) { b.classList.add('right'); b.setAttribute('aria-checked', 'true'); succeed(task, card); }
      else { b.classList.add('wrong'); b.disabled = true; fb(card, 'bad', `${ic('ko')}<span>${L('No es esa. Descártala y prueba otra.', 'Not that one. Rule it out and try another.')}</span>`); }
    });
    if (S.isDone(task.id)) { $$('input, .task-act button', card).forEach(el => { el.disabled = true; }); if (task.type === 'choice') { const r = $(`[data-opt="${task.ans}"]`, card); r.classList.add('right'); r.setAttribute('aria-checked', 'true'); } }
  });
  const onResize = () => { if (!isNarrow() && tab === 'ws') setTab('lesson'); };
  addEventListener('resize', onResize);
  return () => { removeEventListener('resize', onResize); ws.destroy(); CUR_WS = null; };
}

let SEARCH_INDEX = null;
function searchIndex() {

  CHEATS.forEach(g => g.items.forEach(([f, d]) => { if (!/\s{3}| vs /.test(f)) ix.push({ ty: 'flt', i: 'filter', title: f, d, go: `#/lab?f=${encodeURIComponent(f)}`, mono: true }); }));
  FIELD_DEFS.forEach(([n, , d]) => ix.push({ ty: 'fld', i: 'tree', title: n, d, go: `#/lab?f=${encodeURIComponent(n)}`, mono: true }));
  ix.push({ ty: 'act', i: 'sun', title: L('Cambiar tema claro u oscuro', 'Toggle light or dark theme'), act: toggleTheme }, { ty: 'act', i: 'lang', title: L('Interfaz en inglés', 'Interface in Spanish'), act: () => setLang(LANG === 'en' ? 'es' : 'en') }, { ty: 'act', i: 'panel', title: t('sideToggle'), act: toggleSide }, { ty: 'act', i: 'settings', title: t('settings'), act: openSettings }, { ty: 'act', i: 'keyboard', title: t('shortcuts'), act: openKeys }, { ty: 'act', i: 'help', title: t('help'), act: openHelp });

function openSearch() {
  const body = document.createElement('div');
  body.innerHTML = `<div class="sbox"><span aria-hidden="true">${ic('search')}</span><label class="vh" for="s-q">${t('search')}</label><input id="s-q" type="text" role="combobox" aria-expanded="true" aria-controls="s-r" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="${esc(t('searchPh'))}"></div><ul id="s-r" class="sres" role="listbox" aria-label="${L('Resultados', 'Results')}"></ul><p class="sm muted s-foot"><kbd>↑</kbd><kbd>↓</kbd> ${L('moverte', 'move')} · <kbd>Enter</kbd> ${L('abrir', 'open')} · <kbd>Esc</kbd> ${L('cerrar', 'close')}</p>`;
  openDialog({ title: `${ic('search')} ${t('search')}`, body, cls: 'search' });
  const inp = $('#s-q'), list = $('#s-r');
  let res = [], idx = 0;
  const draw = () => {
    const v = norm(inp.value), ix = searchIndex();
    if (!v) res = ix.filter(x => x.ty === 'mod' || x.ty === 'page').slice(0, 14);
    else res = ix.map(x => ({ x, s: x.nt.startsWith(v) ? 3 : x.nt.includes(v) ? 2 : x.nd.includes(v) ? 1 : 0 })).filter(r => r.s).sort((a, b) => b.s - a.s || a.x.title.length - b.x.title.length).slice(0, 30).map(r => r.x);
    idx = 0;
    list.innerHTML = res.length ? res.map((x, i) => `<li role="option" id="s-o${i}" aria-selected="${i === idx}" data-i="${i}"><span class="s-ic">${ic(x.i, 'sm')}</span><span class="s-t"><span class="${x.mono ? 'mono' : ''}">${esc(x.title.length > 110 ? x.title.slice(0, 108) + '…' : x.title)}</span>${x.d ? `<small>${esc(x.d.length > 100 ? x.d.slice(0, 98) + '…' : x.d)}</small>` : ''}</span><span class="s-k">${x.k}</span></li>`).join('') : `<li class="s-none" role="option" aria-disabled="true">${L('Nada por aquí. Prueba con «syn», «cookie» o «dns».', 'Nothing here. Try “syn”, “cookie” or “dns”.')}</li>`;
    inp.setAttribute('aria-activedescendant', res.length ? 's-o0' : '');
  };
  const go = i => { const x = res[i]; if (!x) return; closeDialog(true); if (x.act) x.act(); else if (location.hash === x.go) route(); else location.hash = x.go; };
  const mark = () => { $$('[role=option]', list).forEach((li, i) => li.setAttribute('aria-selected', String(i === idx))); const el = $(`#s-o${idx}`); if (el) { el.scrollIntoView({ block: 'nearest' }); inp.setAttribute('aria-activedescendant', el.id); } };
  inp.addEventListener('input', draw);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(res.length - 1, idx + 1); mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); mark(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(idx); }
  });
  list.addEventListener('click', e => { const li = e.target.closest('[data-i]'); if (li) go(+li.dataset.i); });
  draw(); inp.focus();
}

  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
  if ((e.ctrlKey || e.metaKey) && CUR_WS && !$('#dlg').open && ['f', 'g'].includes(e.key.toLowerCase())) { e.preventDefault(); openFind(CUR_WS, e.key.toLowerCase() === 'g' ? 'goto' : 'find'); return; }
  if (typing || $('#dlg').open || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/' && CUR_WS) { e.preventDefault(); CUR_WS.focusFilter(); }
  else if (e.key === '?') { e.preventDefault(); openKeys(); }
  else if (e.key === '[' && !MOBILE_MQ.matches) { e.preventDefault(); toggleSide(); }
  else if (e.key === 'T' && e.shiftKey) toggleTheme();
  else if ((e.key === 'f' || e.key === 'F') && !e.shiftKey && CUR_WS) CUR_WS.follow();
  else if ((e.key === 's' || e.key === 'S') && !e.shiftKey && CUR_WS) openStats(CUR_WS);
  else if ((e.key === 'e' || e.key === 'E') && !e.shiftKey && CUR_WS) openExpert(CUR_WS);
}

function boot() {
  applyLang(); renderShell(); route();
  setTimeout(() => document.body.classList.add('ready'), 700);          // la entrada escalonada solo en la primera carga
  addEventListener('hashchange', route);
  addEventListener('keydown', onKey);
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.get().settings.theme === 'system') applyTheme(true); });
  let lastXp = S.xp();
  S.on(() => {                                             // el lateral refleja al momento retos, insignias y XP
    updateSide();
    if (S.xp() > lastXp) { const l = $('.lvl'); if (l) { l.classList.remove('bump'); void l.offsetWidth; l.classList.add('bump'); } }
    lastXp = S.xp();
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
